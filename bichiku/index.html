<!doctype html>
<!-- このファイルは「防災備蓄の期限ノート」の本体です。水・食料・電池・薬などの備蓄品を、品名・数量・置き場所・期限で記録し、期限が近い順に一覧します。 -->
<!-- 記録はiPhoneの中のデータベース（IndexedDB）だけに保存し、外部へは一切送信しません。必要な備蓄量の目安などの数値は、このアプリには入っていません（ご家庭で決めてください）。 -->
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>防災備蓄の期限ノート</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-title" content="備蓄期限">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#2f7d6d">
<style>
  :root { --bg:#f3f7f6; --card:#fff; --text:#1a2a27; --sub:#566a66; --accent:#2f7d6d; --accent-soft:#dff0ec; --line:#d9e3e0; --danger:#c8372d;
          --red:#d23a2f; --red-soft:#fde6e4; --orange:#d97a00; --orange-soft:#fff0db; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#111816; --card:#1a2422; --text:#e8f0ee; --sub:#9db0ab; --accent:#5fbfa9; --accent-soft:#1b3530; --line:#2a3734; --danger:#ef6b61;
            --red:#f0675d; --red-soft:#3c1d1b; --orange:#f3a43a; --orange-soft:#3a2c14; }
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif; line-height:1.5; }
  main { max-width:640px; margin:0 auto; padding:calc(12px + env(safe-area-inset-top)) 16px calc(90px + env(safe-area-inset-bottom)); }
  header { display:flex; align-items:center; justify-content:space-between; gap:8px; margin:4px 0 10px; }
  h1 { font-size:1.25rem; margin:0; }
  button { font:inherit; color:inherit; border:none; cursor:pointer; touch-action:manipulation; }
  input, select, textarea { font:inherit; color:var(--text); background:var(--card); border:1px solid var(--line); border-radius:10px; padding:9px 10px; width:100%; }
  input[type=date] { min-height:44px; }
  textarea { min-height:4.5em; resize:vertical; }
  .iconbtn { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:7px 12px; white-space:nowrap; }
  #update { display:none; background:var(--accent); color:#fff; border-radius:12px; padding:10px 14px; margin-bottom:10px; align-items:center; justify-content:space-between; }
  #update button { background:#fff; color:var(--accent); border-radius:99px; padding:6px 14px; font-weight:700; }

  .summary { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; margin-bottom:10px; }
  .sum { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:8px 6px; text-align:center; }
  .sum b { display:block; font-size:1.5rem; line-height:1.2; }
  .sum span { font-size:.78rem; color:var(--sub); }
  .sum.red b { color:var(--red); } .sum.orange b { color:var(--orange); }

  .filters { display:grid; grid-template-columns:1fr 1fr 1fr; gap:6px; margin-bottom:6px; }
  .filters select { padding:7px 6px; font-size:.88rem; }
  .counts { font-size:.82rem; color:var(--sub); margin:6px 0 10px; }

  .card { background:var(--card); border:1px solid var(--line); border-left:6px solid var(--line); border-radius:12px; padding:12px 14px; margin-bottom:10px; cursor:pointer; }
  .card.expired { border-left-color:var(--red); background:var(--red-soft); }
  .card.soon { border-left-color:var(--orange); background:var(--orange-soft); }
  .card .top { display:flex; justify-content:space-between; gap:8px; align-items:flex-start; }
  .card .t { font-weight:700; word-break:break-word; font-size:1.05rem; }
  .card .q { white-space:nowrap; font-weight:700; color:var(--sub); }
  .card .lim { margin-top:4px; font-weight:700; }
  .card.expired .lim { color:var(--red); } .card.soon .lim { color:var(--orange); }
  .card .m { font-size:.8rem; color:var(--sub); margin-top:4px; }
  .card .use { margin-top:8px; background:var(--accent); color:#fff; border-radius:10px; padding:9px 14px; font-weight:700; width:100%; }
  .tag { display:inline-block; font-size:.75rem; border-radius:99px; padding:0 8px; margin:2px 4px 0 0; background:var(--accent-soft); color:var(--accent); }
  .empty { color:var(--sub); text-align:center; padding:30px 0; }

  #add { position:fixed; right:20px; bottom:calc(20px + env(safe-area-inset-bottom)); width:60px; height:60px; border-radius:50%;
         background:var(--accent); color:#fff; font-size:2rem; box-shadow:0 4px 12px rgba(0,0,0,.25); }

  .sheet { position:fixed; inset:0; background:var(--bg); overflow:auto; display:none; z-index:10; }
  .sheet.open { display:block; }
  .sheet .inner { max-width:640px; margin:0 auto; padding:calc(12px + env(safe-area-inset-top)) 16px calc(30px + env(safe-area-inset-bottom)); }
  .sheet h2 { font-size:1.15rem; margin:4px 0 12px; }
  label.f { display:block; font-size:.85rem; color:var(--sub); margin:10px 0 4px; }
  .row2 { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .datebox { display:flex; gap:6px; } .datebox input { flex:1; min-width:0; } .datebox button { white-space:nowrap; }
  .actions { display:flex; gap:8px; flex-wrap:wrap; margin-top:16px; }
  .primary { background:var(--accent); color:#fff; border-radius:12px; padding:12px 18px; font-weight:700; }
  .primary:disabled { opacity:.5; }
  .plain { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px 16px; }
  .small { padding:8px 12px; border-radius:10px; font-size:.88rem; }
  .danger { color:var(--danger); }
  .note { font-size:.8rem; color:var(--sub); margin:8px 0 0; }
  .warn { background:#fff5e0; color:#6b4a00; border-radius:10px; padding:8px 10px; font-size:.82rem; margin-bottom:6px; }
  @media (prefers-color-scheme: dark) { .warn { background:#3a2e12; color:#f3dca6; } }
  .box { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px 14px; }
  footer { text-align:center; font-size:.78rem; color:var(--sub); margin-top:16px; }
</style>
</head>
<body>
<main>
  <div id="update"><span>新しい版があります</span><button id="update-btn">更新する</button></div>
  <header>
    <h1>🧰 防災備蓄の期限ノート</h1>
    <button class="iconbtn" id="open-settings">⚙️ 設定</button>
  </header>

  <div class="summary">
    <div class="sum red"><b id="n-exp">0</b><span>期限切れ</span></div>
    <div class="sum orange"><b id="n-soon">0</b><span>30日以内</span></div>
    <div class="sum"><b id="n-all">0</b><span>登録数</span></div>
  </div>

  <div class="filters">
    <select id="f-place" aria-label="置き場所で絞り込み"></select>
    <select id="f-cat" aria-label="種類で絞り込み"></select>
    <select id="f-st" aria-label="期限で絞り込み"></select>
  </div>
  <div class="counts" id="counts"></div>
  <div id="list"></div>
  <footer>版 <span id="ver"></span> ・ データはこのiPhoneの中だけに保存されます<br>必要な量の目安はアプリには入っていません。ご家庭で決めてください。</footer>
</main>

<button id="add" aria-label="備蓄品を追加">＋</button>

<!-- 入力・編集 -->
<div class="sheet" id="edit">
  <div class="inner">
    <h2 id="edit-title">備蓄品を追加</h2>
    <label class="f" for="e-name">品名</label>
    <input id="e-name" maxlength="60" placeholder="例：水（2リットル）">
    <div class="row2">
      <div><label class="f" for="e-qty">数量（整数・任意）</label><input id="e-qty" inputmode="numeric" maxlength="6" placeholder="例：6"></div>
      <div><label class="f" for="e-unit">単位（任意）</label><input id="e-unit" maxlength="20" placeholder="例：本"></div>
    </div>
    <div class="row2">
      <div><label class="f" for="e-cat">種類</label><select id="e-cat"></select></div>
      <div><label class="f" for="e-place">置き場所</label><input id="e-place" list="place-list" maxlength="40" placeholder="例：玄関の収納"></div>
    </div>
    <datalist id="place-list"></datalist>
    <label class="f" for="e-exp">期限（任意。賞味期限・使用期限など）</label>
    <div class="datebox"><input id="e-exp" type="date"><button class="plain small" id="e-exp-clear" type="button">期限なし</button></div>
    <label class="f" for="e-memo">メモ（任意）</label>
    <textarea id="e-memo" placeholder="例：家族で決めた入れ替えの時期など"></textarea>
    <div class="actions">
      <button class="primary" id="e-save">保存する</button>
      <button class="plain" id="e-cancel">やめる</button>
      <button class="plain danger" id="e-del" hidden>削除</button>
    </div>
    <p class="note" id="e-meta"></p>
  </div>
</div>

<!-- 使った・入れ替えた -->
<div class="sheet" id="swap">
  <div class="inner">
    <h2>使った・入れ替えた</h2>
    <div class="box"><b id="s-name"></b><div class="note" id="s-now" style="margin-top:2px"></div></div>
    <label class="f" for="s-exp">新しい期限（入れ替えた品の期限を入れてください）</label>
    <div class="datebox"><input id="s-exp" type="date"><button class="plain small" id="s-exp-clear" type="button">期限なし</button></div>
    <div class="row2">
      <div><label class="f" for="s-qty">いまの数量（整数・任意）</label><input id="s-qty" inputmode="numeric" maxlength="6"></div>
      <div><label class="f">単位</label><input id="s-unit" disabled></div>
    </div>
    <div class="actions">
      <button class="primary" id="s-save">記録する</button>
      <button class="plain" id="s-cancel">やめる</button>
    </div>
  </div>
</div>

<!-- 設定 -->
<div class="sheet" id="settings">
  <div class="inner">
    <h2>⚙️ 設定</h2>
    <label class="f">アイコンの数字</label>
    <div class="box">
      <p class="note" style="margin-top:0">ホーム画面のアイコンに、期限切れと30日以内に期限が来る品の数を出します。通知の許可が必要です（通知そのものは送りません）。</p>
      <p class="note" id="badge-state"></p>
      <div class="actions" style="margin-top:8px"><button class="plain" id="badge-btn">数字を出す（許可する）</button></div>
    </div>

    <label class="f" style="margin-top:22px">バックアップ</label>
    <p class="note" style="margin-top:0">ホーム画面のアイコンを削除すると、記録もすべて消えます。ときどき書き出して、「ファイル」アプリなどに保存してください。</p>
    <div class="actions">
      <button class="plain" id="export">書き出す（保存）</button>
      <button class="plain" id="import-btn">読み込む</button>
      <input type="file" id="import" accept="application/json,.json" hidden>
    </div>
    <p class="note" id="usage"></p>
    <div class="actions"><button class="plain" id="set-close">閉じる</button></div>
  </div>
</div>

<script>
// ===== 基本の設定 =====
// アプリを更新するときは、この番号と sw.js の VERSION を同じ番号に上げる
const APP_VERSION = '1.0.0';
const KEY_FILTER = 'bichiku:filter';   // 最後に選んだ絞り込み
const CATS = ['水', '食料', '電池・電気', '薬・救急', '衛生用品', 'その他'];
const STS = [['', '期限：すべて'], ['exp', '期限切れ'], ['soon', '30日以内'], ['none', '期限なし']];
const SOON_DAYS = 30;
const $ = (id) => document.getElementById(id);

// ===== 端末内のデータベース（IndexedDB） =====
function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open('bichiku', 1);
    req.onupgradeneeded = () => req.result.createObjectStore('items', { keyPath: 'id' });
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function dbDo(mode, fn) {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction('items', mode);
    const r = fn(tx.objectStore('items'));
    tx.oncomplete = () => resolve(r && r.result);
    tx.onerror = () => reject(tx.error);
  });
}
const dbAll = () => dbDo('readonly', (s) => s.getAll());
const dbPut = (it) => dbDo('readwrite', (s) => s.put(it));
const dbDel = (id) => dbDo('readwrite', (s) => s.delete(id));

// ===== 小さな道具 =====
function load(key, fallback) { try { const t = localStorage.getItem(key); return t ? JSON.parse(t) : fallback; } catch (e) { return fallback; } }
function save(key, v) { try { localStorage.setItem(key, JSON.stringify(v)); } catch (e) {} }
const p2 = (n) => String(n).padStart(2, '0');
const str = (v) => (typeof v === 'string' ? v : (typeof v === 'number' && isFinite(v) ? String(v) : ''));
const num = (v) => (typeof v === 'number' && isFinite(v) ? v : 0);
function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; }
function fillSelect(sel, pairs) { sel.innerHTML = ''; pairs.forEach(([v, t]) => sel.add(new Option(t, v))); }
function todayStr() { const d = new Date(); return d.getFullYear() + '-' + p2(d.getMonth() + 1) + '-' + p2(d.getDate()); }
// 「2027-03-01」の形で、実在する日付なら Date を返す
function parseYmd(s) {
  if (!/^\d{4}-\d{2}-\d{2}$/.test(s || '')) return null;
  const [y, m, d] = s.split('-').map(Number);
  const dt = new Date(y, m - 1, d);
  return dt.getFullYear() === y && dt.getMonth() === m - 1 && dt.getDate() === d ? dt : null;
}
const fmtYmd = (s) => { const d = parseYmd(s); return d ? d.getFullYear() + '/' + (d.getMonth() + 1) + '/' + d.getDate() : ''; };
function fmtDate(ms) { const d = new Date(ms); return d.getFullYear() + '/' + (d.getMonth() + 1) + '/' + d.getDate() + ' ' + p2(d.getHours()) + ':' + p2(d.getMinutes()); }
function daysUntil(s) { const a = parseYmd(s); return a ? Math.round((a - parseYmd(todayStr())) / 86400000) : null; }
// 全角数字を半角に（値は変えない）
const half = (s) => s.replace(/[０-９]/g, (c) => String.fromCharCode(c.charCodeAt(0) - 0xFEE0)).trim();
// 数量：空か、0以上の整数だけを受け付ける。それ以外は null（入れ直し）
function readQty(input) {
  const v = half(input.value);
  if (v === '') return '';
  if (!/^\d{1,6}$/.test(v)) return null;
  return String(Number(v));
}
const newId = () => 'b' + Date.now() + Math.random().toString(36).slice(2, 6);

// 1件の記録を、欠けた項目を補った正しい形にそろえる（読み込み時にも使う）
function normItem(x) {
  if (!x || typeof x !== 'object') return null;
  const name = str(x.name).trim().slice(0, 60);
  if (!name) return null;
  const now = Date.now();
  return {
    id: str(x.id) || newId(),
    name,
    qty: /^\d{1,6}$/.test(str(x.qty)) ? String(Number(x.qty)) : '',
    unit: str(x.unit).slice(0, 20),
    category: CATS.includes(x.category) ? x.category : 'その他',
    place: str(x.place).trim().slice(0, 40),
    expiry: parseYmd(str(x.expiry)) ? x.expiry : '',
    memo: str(x.memo),
    createdAt: num(x.createdAt) || now,
    updatedAt: num(x.updatedAt) || now,
    replacedAt: num(x.replacedAt),
  };
}
// 期限の状態：exp（期限切れ）/ soon（30日以内）/ ok / none（期限なし）
function stateOf(it) {
  const d = daysUntil(it.expiry);
  if (d === null) return 'none';
  if (d < 0) return 'exp';
  return d <= SOON_DAYS ? 'soon' : 'ok';
}
function limitText(it) {
  const d = daysUntil(it.expiry);
  if (d === null) return '期限なし';
  const base = '期限 ' + fmtYmd(it.expiry);
  if (d < 0) return base + '（期限切れ・' + (-d) + '日過ぎ）';
  if (d === 0) return base + '（今日まで）';
  return base + '（あと' + d + '日）';
}

let items = [];
let filter = load(KEY_FILTER, { place: '', cat: '', st: '' });
if (!filter || typeof filter !== 'object') filter = { place: '', cat: '', st: '' };

// ===== 一覧の表示 =====
const places = () => [...new Set(items.map((i) => i.place).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'ja'));
function buildFilters() {
  const ps = places();
  fillSelect($('f-place'), [['', '置き場所：すべて'], ...ps.map((p) => [p, p])]);
  fillSelect($('f-cat'), [['', '種類：すべて'], ...CATS.map((c) => [c, c])]);
  fillSelect($('f-st'), STS);
  $('f-place').value = ps.includes(filter.place) ? filter.place : '';
  $('f-cat').value = CATS.includes(filter.cat) ? filter.cat : '';
  $('f-st').value = STS.some(([v]) => v === filter.st) ? filter.st : '';
  const dl = $('place-list'); dl.innerHTML = '';
  ps.forEach((p) => dl.append(new Option(p)));
}
function render() {
  filter = { place: $('f-place').value, cat: $('f-cat').value, st: $('f-st').value };
  save(KEY_FILTER, filter);
  const nExp = items.filter((i) => stateOf(i) === 'exp').length;
  const nSoon = items.filter((i) => stateOf(i) === 'soon').length;
  $('n-exp').textContent = nExp; $('n-soon').textContent = nSoon; $('n-all').textContent = items.length;

  const shown = items.filter((i) =>
    (!filter.place || i.place === filter.place) &&
    (!filter.cat || i.category === filter.cat) &&
    (!filter.st || stateOf(i) === filter.st));
  // 期限が近い順。期限なしは最後（同じなら品名順）
  shown.sort((a, b) => {
    const da = daysUntil(a.expiry), db = daysUntil(b.expiry);
    if (da === null && db === null) return a.name.localeCompare(b.name, 'ja');
    if (da === null) return 1;
    if (db === null) return -1;
    return da - db || a.name.localeCompare(b.name, 'ja');
  });
  $('counts').textContent = shown.length !== items.length ? '絞り込み中：' + shown.length + '件を表示' : (items.length ? '期限が近い順に並んでいます' : '');

  const list = $('list');
  list.innerHTML = '';
  if (!shown.length) {
    list.append(el('p', 'empty', items.length ? '条件に合う品はありません' : 'まだ登録がありません。右下の「＋」から追加してください。'));
    return;
  }
  for (const it of shown) {
    const st = stateOf(it);
    const c = el('div', 'card' + (st === 'exp' ? ' expired' : st === 'soon' ? ' soon' : ''));
    const top = el('div', 'top');
    top.append(el('div', 't', it.name));
    if (it.qty !== '') top.append(el('div', 'q', it.qty + (it.unit || '')));
    c.append(top);
    c.append(el('div', 'lim', (st === 'exp' ? '⚠️ ' : st === 'soon' ? '⏰ ' : '') + limitText(it)));
    const m = el('div', 'm');
    m.append(el('span', 'tag', it.category));
    if (it.place) m.append(el('span', 'tag', '📍' + it.place));
    if (it.replacedAt) m.append(document.createTextNode(' 入れ替え ' + fmtDate(it.replacedAt)));
    c.append(m);
    const use = el('button', 'use', '使った・入れ替えた');
    use.onclick = (e) => { e.stopPropagation(); openSwap(it); };
    c.append(use);
    c.onclick = () => openEdit(it);
    list.append(c);
  }
}
['f-place', 'f-cat', 'f-st'].forEach((id) => $(id).addEventListener('change', render));

async function reload() {
  try { items = (await dbAll()).map(normItem).filter(Boolean); } catch (e) { items = []; alert('データベースを開けませんでした。'); }
  buildFilters();
  render();
  updateBadge();
}

// ===== アイコンの数字（通知を許可済みのときだけ） =====
const badgeSupported = () => 'setAppBadge' in navigator && typeof Notification !== 'undefined';
function updateBadge() {
  if (!badgeSupported() || Notification.permission !== 'granted') return;
  const n = items.filter((i) => ['exp', 'soon'].includes(stateOf(i))).length;
  (n ? navigator.setAppBadge(n) : navigator.clearAppBadge()).catch(() => {});
}
function showBadgeState() {
  const btn = $('badge-btn');
  if (!badgeSupported()) {
    $('badge-state').textContent = 'この開き方では使えません。iPhoneでは、ホーム画面に追加したアプリから開くと使える場合があります。';
    btn.hidden = true; return;
  }
  btn.hidden = Notification.permission === 'granted';
  $('badge-state').textContent = Notification.permission === 'granted' ? '✅ 許可済み：アイコンに数字が出ます。'
    : Notification.permission === 'denied' ? '許可されていません。iPhoneの「設定」→「通知」から、このアプリを許可すると使えます。'
    : 'まだ許可していません。';
}
$('badge-btn').onclick = async () => {
  try { await Notification.requestPermission(); } catch (e) {}
  showBadgeState(); updateBadge();
};

// ===== 入力・編集 =====
let editing = null;
let busy = false; // 保存ボタンの連打で2件できないようにする
function openEdit(it) {
  editing = it || null;
  fillSelect($('e-cat'), CATS.map((c) => [c, c]));
  $('edit-title').textContent = it ? '備蓄品を編集' : '備蓄品を追加';
  $('e-name').value = it ? it.name : '';
  $('e-qty').value = it ? it.qty : '';
  $('e-unit').value = it ? it.unit : '';
  $('e-cat').value = it ? it.category : (filter.cat || CATS[0]);
  $('e-place').value = it ? it.place : (filter.place || '');
  $('e-exp').value = it ? it.expiry : '';
  $('e-memo').value = it ? it.memo : '';
  $('e-del').hidden = !it;
  $('e-meta').textContent = it ? '登録 ' + fmtDate(it.createdAt) + ' ／ 更新 ' + fmtDate(it.updatedAt) : '';
  $('edit').classList.add('open');
  window.scrollTo(0, 0);
}
function closeSheet(id) { $(id).classList.remove('open'); }
$('add').onclick = () => openEdit(null);
$('e-cancel').onclick = () => closeSheet('edit');
$('e-exp-clear').onclick = () => { $('e-exp').value = ''; };
$('e-save').onclick = async () => {
  if (busy) return;
  const name = $('e-name').value.trim();
  if (!name) { alert('品名を入れてください。'); $('e-name').focus(); return; }
  const qty = readQty($('e-qty'));
  if (qty === null) { alert('数量は0以上の整数（例：6）で入れてください。小数やマイナスは使えません。空のままでもかまいません。'); $('e-qty').focus(); return; }
  const exp = $('e-exp').value;
  if (exp && !parseYmd(exp)) { alert('期限の日付を正しく入れてください。'); return; }
  const now = Date.now();
  const it = normItem({
    ...(editing || { id: newId(), createdAt: now }),
    name, qty, unit: $('e-unit').value.trim(), category: $('e-cat').value,
    place: $('e-place').value, expiry: exp, memo: $('e-memo').value, updatedAt: now,
  });
  busy = true; $('e-save').disabled = true;
  try { await dbPut(it); closeSheet('edit'); await reload(); }
  catch (e) { alert('保存できませんでした。iPhoneの空き容量を確認してください。'); }
  finally { busy = false; $('e-save').disabled = false; }
};
$('e-del').onclick = async () => {
  if (!editing || !confirm('「' + editing.name + '」を削除します。元に戻せません。よろしいですか？')) return;
  await dbDel(editing.id);
  closeSheet('edit');
  reload();
};

// ===== 使った・入れ替えた =====
let swapping = null;
function openSwap(it) {
  swapping = it;
  $('s-name').textContent = it.name;
  $('s-now').textContent = 'いま：' + limitText(it) + (it.qty !== '' ? ' ／ ' + it.qty + (it.unit || '') : '');
  $('s-exp').value = '';
  $('s-qty').value = it.qty;
  $('s-unit').value = it.unit || '（なし）';
  $('swap').classList.add('open');
  window.scrollTo(0, 0);
}
$('s-cancel').onclick = () => closeSheet('swap');
$('s-exp-clear').onclick = () => { $('s-exp').value = ''; };
$('s-save').onclick = async () => {
  if (busy || !swapping) return;
  const exp = $('s-exp').value;
  if (exp && !parseYmd(exp)) { alert('期限の日付を正しく入れてください。'); return; }
  if (!exp && !confirm('新しい期限が空です。「期限なし」として記録します。よろしいですか？')) return;
  const qty = readQty($('s-qty'));
  if (qty === null) { alert('数量は0以上の整数（例：6）で入れてください。小数やマイナスは使えません。空のままでもかまいません。'); $('s-qty').focus(); return; }
  const now = Date.now();
  busy = true; $('s-save').disabled = true;
  try { await dbPut(normItem({ ...swapping, expiry: exp, qty, replacedAt: now, updatedAt: now })); closeSheet('swap'); await reload(); }
  catch (e) { alert('記録できませんでした。'); }
  finally { busy = false; $('s-save').disabled = false; }
};

// ===== 設定 =====
$('open-settings').onclick = () => { showBadgeState(); showUsage(); $('settings').classList.add('open'); window.scrollTo(0, 0); };
$('set-close').onclick = () => closeSheet('settings');

// ===== バックアップ =====
$('export').onclick = async () => {
  const d = new Date();
  const name = 'bichiku-backup-' + d.getFullYear() + p2(d.getMonth() + 1) + p2(d.getDate()) + '.json';
  const data = JSON.stringify({ app: 'bichiku', version: APP_VERSION, exportedAt: d.toISOString(), items }, null, 1);
  const file = new File([data], name, { type: 'application/json' });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], title: name }); } catch (e) {}
    return;
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(file); a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 10000);
};
$('import-btn').onclick = () => $('import').click();
$('import').onchange = async (e) => {
  const f = e.target.files[0]; e.target.value = '';
  if (!f) return;
  let data;
  try { data = JSON.parse(await f.text()); } catch (err) { alert('ファイルを読み取れませんでした。壊れているか、別の種類のファイルです。'); return; }
  if (!data || data.app !== 'bichiku' || !Array.isArray(data.items)) { alert('このアプリのバックアップファイルではありません。'); return; }
  const list = data.items.map(normItem).filter(Boolean);
  if (!list.length) { alert('読み込める記録がありませんでした。'); return; }
  if (!confirm(list.length + '件を読み込みます。同じ記録は、ファイルの内容で上書きします（ほかの記録は消えません）。よろしいですか？')) return;
  try { for (const it of list) await dbPut(it); } catch (err) { alert('読み込みの途中で保存できませんでした。'); }
  await reload();
  alert('読み込みました。');
};
async function showUsage() {
  if (!navigator.storage || !navigator.storage.estimate) { $('usage').textContent = ''; return; }
  try { const { usage } = await navigator.storage.estimate(); $('usage').textContent = '使用量：約' + Math.max(0.1, (usage || 0) / 1024 / 1024).toFixed(1) + 'MB'; } catch (e) {}
}
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});

// ===== オフライン動作と更新の受け取り（サービスワーカー） =====
if ('serviceWorker' in navigator) {
  const hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.register('sw.js').then((reg) => {
    const showUpdate = (w) => { $('update').style.display = 'flex'; $('update-btn').onclick = () => w.postMessage('SKIP_WAITING'); };
    if (reg.waiting && navigator.serviceWorker.controller) showUpdate(reg.waiting);
    reg.addEventListener('updatefound', () => {
      const w = reg.installing;
      w.addEventListener('statechange', () => { if (w.state === 'installed' && navigator.serviceWorker.controller) showUpdate(w); });
    });
    document.addEventListener('visibilitychange', () => { if (!document.hidden) reg.update(); });
  });
  let reloaded = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (!hadController || reloaded || $('edit').classList.contains('open') || $('swap').classList.contains('open')) return; // 入力中は読み込み直さない
    reloaded = true; location.reload();
  });
}
// 日付が変わったあとに開き直したとき、色分けと数字を新しくする
document.addEventListener('visibilitychange', () => { if (!document.hidden) { render(); updateBadge(); } });

// ===== 起動 =====
$('ver').textContent = APP_VERSION;
reload();
</script>
</body>
</html>
