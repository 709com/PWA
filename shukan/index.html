<!doctype html>
<!-- このファイルは「習慣トラッカー」の本体です。運動・読書などの習慣を登録し、毎日タップで達成を記録して、月のカレンダー・連続日数・達成率を表示します。 -->
<!-- 記録はiPhoneの中（localStorage＝ブラウザの小さな保存場所）だけに保存し、外部へは一切送信しません。 -->
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>習慣トラッカー</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-title" content="習慣">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#2f8f5b">
<style>
  :root { --bg:#f3f8f5; --card:#fff; --text:#1b2a22; --sub:#5a6a62; --accent:#2f8f5b; --accent-soft:#e0f1e7; --line:#dbe6df; --danger:#c8372d; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#111815; --card:#1b2420; --text:#e7f0eb; --sub:#9aaba2; --accent:#5cc08a; --accent-soft:#1d3427; --line:#2a3630; --danger:#ef6b61; }
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif; line-height:1.5; }
  main { max-width:640px; margin:0 auto; padding:calc(12px + env(safe-area-inset-top)) 16px calc(90px + env(safe-area-inset-bottom)); }
  header { display:flex; align-items:center; justify-content:space-between; gap:8px; margin:4px 0 4px; }
  h1 { font-size:1.3rem; margin:0; }
  button { font:inherit; color:inherit; border:none; cursor:pointer; touch-action:manipulation; }
  input { font:inherit; color:var(--text); background:var(--card); border:1px solid var(--line); border-radius:10px; padding:10px; width:100%; }
  .iconbtn { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:7px 12px; white-space:nowrap; }
  #update { display:none; background:var(--accent); color:#fff; border-radius:12px; padding:10px 14px; margin-bottom:10px; align-items:center; justify-content:space-between; }
  #update button { background:#fff; color:var(--accent); border-radius:99px; padding:6px 14px; font-weight:700; }
  .today { color:var(--sub); font-size:.92rem; margin:0 0 10px; }

  /* 習慣のカード：左の大きなボタンで今日の達成をつける */
  .habit { display:flex; align-items:stretch; gap:10px; background:var(--card); border:1px solid var(--line); border-radius:16px; padding:10px; margin-bottom:10px; }
  .check { flex:0 0 64px; height:64px; border-radius:14px; border:3px solid var(--hc); background:transparent; color:var(--hc); font-size:1.9rem; font-weight:700; }
  .habit.done .check { background:var(--hc); color:#fff; }
  .check:active { transform:scale(.95); }
  .hinfo { flex:1; min-width:0; display:flex; flex-direction:column; justify-content:center; cursor:pointer; }
  .hname { font-weight:700; font-size:1.08rem; word-break:break-word; }
  .hstat { font-size:.82rem; color:var(--sub); }
  .more { align-self:center; color:var(--sub); font-size:1.4rem; padding:0 4px; cursor:pointer; }
  .empty { color:var(--sub); text-align:center; padding:30px 0; }
  .hint { font-size:.8rem; color:var(--sub); margin:4px 0 10px; }

  #add { position:fixed; right:20px; bottom:calc(20px + env(safe-area-inset-bottom)); width:60px; height:60px; border-radius:50%;
         background:var(--accent); color:#fff; font-size:2rem; box-shadow:0 4px 12px rgba(0,0,0,.25); }

  .sheet { position:fixed; inset:0; background:var(--bg); overflow:auto; display:none; z-index:10; }
  .sheet.open { display:block; }
  #edit { z-index:11; }  /* 詳細の上に重ねて開く */
  .sheet .inner { max-width:640px; margin:0 auto; padding:calc(12px + env(safe-area-inset-top)) 16px calc(30px + env(safe-area-inset-bottom)); }
  .sheet h2 { font-size:1.15rem; margin:4px 0 12px; word-break:break-word; }
  label.f { display:block; font-size:.85rem; color:var(--sub); margin:12px 0 4px; }
  .actions { display:flex; gap:8px; flex-wrap:wrap; margin-top:16px; }
  .primary { background:var(--accent); color:#fff; border-radius:12px; padding:12px 18px; font-weight:700; }
  .plain { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px 16px; }
  .danger { color:var(--danger); }
  .note { font-size:.8rem; color:var(--sub); margin:8px 0 0; }
  .colors { display:flex; gap:10px; flex-wrap:wrap; }
  .colors button { width:44px; height:44px; border-radius:50%; border:3px solid transparent; }
  .colors button.sel { border-color:var(--text); }

  /* 詳細：数字とカレンダー */
  .stats { display:grid; grid-template-columns:repeat(3, 1fr); gap:8px; margin-bottom:12px; }
  .stat { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:8px; text-align:center; }
  .stat b { display:block; font-size:1.35rem; color:var(--hc); }
  .stat span { font-size:.75rem; color:var(--sub); }
  .cal { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:10px; }
  .calhead { display:flex; align-items:center; justify-content:space-between; margin-bottom:6px; }
  .calhead b { font-size:1.05rem; }
  .calhead button { background:var(--bg); border:1px solid var(--line); border-radius:10px; padding:6px 14px; font-size:1.1rem; }
  .grid { display:grid; grid-template-columns:repeat(7, minmax(0, 1fr)); gap:4px; text-align:center; }
  .grid .wd { font-size:.75rem; color:var(--sub); }
  .grid .wd:first-child { color:#d0453b; } .grid .wd:last-child { color:#2f6fd0; }
  .day { height:44px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:.92rem; background:var(--bg); }
  .day.on { background:var(--hc); color:#fff; font-weight:700; }
  .day.today { outline:2px solid var(--text); outline-offset:-2px; }
  .day.future { opacity:.35; }
  .monthrate { font-size:.85rem; color:var(--sub); margin:8px 2px 0; }
  footer { text-align:center; font-size:.78rem; color:var(--sub); margin-top:16px; }
</style>
</head>
<body>
<main>
  <div id="update"><span>新しい版があります</span><button id="update-btn">更新する</button></div>
  <header>
    <h1>✅ 習慣トラッカー</h1>
    <button class="iconbtn" id="open-settings">⚙️ 設定</button>
  </header>
  <p class="today" id="today"></p>
  <div id="list"></div>
  <p class="hint" id="hint">左の四角をタップすると、今日の「できた」を記録します（もう一度タップで取り消し）。名前をタップするとカレンダーを表示します。</p>
  <footer>版 <span id="ver"></span> ・ 記録はこのiPhoneの中だけに保存されます</footer>
</main>

<button id="add" aria-label="習慣を追加">＋</button>

<!-- 習慣の追加・編集 -->
<div class="sheet" id="edit">
  <div class="inner">
    <h2 id="edit-title">習慣を追加</h2>
    <label class="f" for="e-name">名前</label>
    <input id="e-name" maxlength="30" placeholder="例：運動、読書、ストレッチ">
    <label class="f">色</label>
    <div class="colors" id="e-colors"></div>
    <div class="actions">
      <button class="primary" id="e-save">保存する</button>
      <button class="plain" id="e-cancel">やめる</button>
      <button class="plain danger" id="e-del" hidden>削除</button>
    </div>
  </div>
</div>

<!-- 習慣の詳細（カレンダー） -->
<div class="sheet" id="detail">
  <div class="inner">
    <h2 id="d-title"></h2>
    <div class="stats">
      <div class="stat"><b id="d-streak">0</b><span>いまの連続日数</span></div>
      <div class="stat"><b id="d-best">0</b><span>最長の連続日数</span></div>
      <div class="stat"><b id="d-total">0</b><span>これまでの合計</span></div>
    </div>
    <div class="cal">
      <div class="calhead"><button id="d-prev" aria-label="前の月">‹</button><b id="d-month"></b><button id="d-next" aria-label="次の月">›</button></div>
      <div class="grid" id="d-grid"></div>
      <p class="monthrate" id="d-rate"></p>
    </div>
    <p class="note">日付をタップすると、その日の記録をつけたり消したりできます（つけ忘れの修正用。先の日付はつけられません）。</p>
    <div class="actions">
      <button class="plain" id="d-close">閉じる</button>
      <button class="plain" id="d-edit">名前・色を変える</button>
    </div>
  </div>
</div>

<!-- 設定 -->
<div class="sheet" id="settings">
  <div class="inner">
    <h2>⚙️ 設定</h2>
    <label class="f">バックアップ</label>
    <p class="note" style="margin-top:0">ホーム画面のアイコンを削除すると、記録もすべて消えます。ときどき書き出して、「ファイル」アプリなどに保存してください。</p>
    <div class="actions">
      <button class="plain" id="export">書き出す（共有・保存）</button>
      <button class="plain" id="import-btn">読み込む</button>
      <input type="file" id="import" accept="application/json,.json" hidden>
    </div>
    <div class="actions"><button class="plain" id="s-close">閉じる</button></div>
  </div>
</div>

<script>
// ===== 基本の設定 =====
// アプリを更新するときは、この番号と sw.js の VERSION を同じ番号に上げる
const APP_VERSION = '1.0.0';
const KEY_DATA = 'shukan:data';   // { habits:[{id,name,color,createdAt}], done:{ 習慣id: ['2026-11-13', ...] } }
const COLORS = ['#2f8f5b', '#2f6fd0', '#e07b1f', '#c0457a', '#7a52c7', '#1f9aa8'];
const WEEK = ['日', '月', '火', '水', '木', '金', '土'];
const $ = (id) => document.getElementById(id);

// ===== 小さな道具 =====
function load(key, fallback) { try { const t = localStorage.getItem(key); return t ? JSON.parse(t) : fallback; } catch (e) { return fallback; } }
function save(key, v) { try { localStorage.setItem(key, JSON.stringify(v)); return true; } catch (e) { alert('保存できませんでした。'); return false; } }
function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; }
const p2 = (n) => String(n).padStart(2, '0');
// 日付は「2026-11-13」の形の文字で扱う（iPhoneの時計の日付）
const ymd = (d) => d.getFullYear() + '-' + p2(d.getMonth() + 1) + '-' + p2(d.getDate());
const parse = (s) => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return ymd(d); };
const todayStr = () => ymd(new Date());

let data = load(KEY_DATA, { habits: [], done: {} });
if (!data.habits) data = { habits: [], done: {} };
const doneSet = (id) => new Set(data.done[id] || []);
function setDone(id, day, on) {
  const s = doneSet(id);
  if (on) s.add(day); else s.delete(day);
  data.done[id] = [...s].sort();
  save(KEY_DATA, data);
}

// ===== 数字の計算 =====
// いまの連続日数：今日（まだなら昨日）からさかのぼって、続けてできた日数
function currentStreak(id) {
  const s = doneSet(id);
  let d = todayStr();
  if (!s.has(d)) d = addDays(d, -1);
  let n = 0;
  while (s.has(d)) { n++; d = addDays(d, -1); }
  return n;
}
function bestStreak(id) {
  const days = [...doneSet(id)].sort();
  let best = 0, run = 0, prev = null;
  for (const d of days) { run = (prev && addDays(prev, 1) === d) ? run + 1 : 1; best = Math.max(best, run); prev = d; }
  return best;
}
// その月の達成率：分母は「その月のうち、習慣を登録した日から今日までの日数」
function monthRate(h, y, m) {
  const s = doneSet(h.id);
  const first = ymd(new Date(y, m, 1)), last = ymd(new Date(y, m + 1, 0));
  const created = ymd(new Date(h.createdAt));
  let start = created > first ? created : first;
  const today = todayStr();
  const end = today < last ? today : last;
  // 登録より前の日に記録をつけた場合は、その日から数える
  for (const d of s) if (d >= first && d < start) start = d;
  if (end < start) return null;
  let days = 0, done = 0;
  for (let d = start; d <= end; d = addDays(d, 1)) { days++; if (s.has(d)) done++; }
  return { days, done, pct: Math.round(done * 100 / days) };
}

// ===== 一覧の表示 =====
function render() {
  const now = new Date();
  $('today').textContent = '今日は ' + (now.getMonth() + 1) + '月' + now.getDate() + '日（' + WEEK[now.getDay()] + '）';
  const list = $('list'); list.innerHTML = '';
  $('hint').hidden = !data.habits.length;
  if (!data.habits.length) { list.append(el('p', 'empty', 'まだ習慣がありません。右下の「＋」から追加してください。')); return; }
  const t = todayStr();
  for (const h of data.habits) {
    const done = doneSet(h.id).has(t);
    const card = el('div', 'habit' + (done ? ' done' : ''));
    card.style.setProperty('--hc', h.color);
    const btn = el('button', 'check', done ? '✓' : '');
    btn.setAttribute('aria-label', h.name + '：今日できた');
    btn.onclick = () => { setDone(h.id, todayStr(), !doneSet(h.id).has(todayStr())); render(); };
    const info = el('div', 'hinfo');
    info.append(el('div', 'hname', h.name));
    const r = monthRate(h, now.getFullYear(), now.getMonth());
    info.append(el('div', 'hstat', '連続 ' + currentStreak(h.id) + '日 ・ 今月 ' + (r ? r.done + '/' + r.days + '日（' + r.pct + '%）' : '―')));
    info.onclick = () => openDetail(h);
    const more = el('div', 'more', '›'); more.onclick = () => openDetail(h);
    card.append(btn, info, more);
    list.append(card);
  }
}

// ===== 追加・編集 =====
let editing = null, pickedColor = COLORS[0];
function buildColors() {
  const box = $('e-colors'); box.innerHTML = '';
  for (const c of COLORS) {
    const b = el('button', c === pickedColor ? 'sel' : '');
    b.style.background = c; b.setAttribute('aria-label', '色');
    b.onclick = () => { pickedColor = c; buildColors(); };
    box.append(b);
  }
}
function openEdit(h) {
  editing = h || null;
  $('edit-title').textContent = h ? '習慣を編集' : '習慣を追加';
  $('e-name').value = h ? h.name : '';
  pickedColor = h ? h.color : COLORS[data.habits.length % COLORS.length];
  buildColors();
  $('e-del').hidden = !h;
  $('edit').classList.add('open');
  window.scrollTo(0, 0);
}
const closeSheet = (id) => $(id).classList.remove('open');
$('add').onclick = () => openEdit(null);
$('e-cancel').onclick = () => closeSheet('edit');
$('e-save').onclick = () => {
  const name = $('e-name').value.trim().slice(0, 30);
  if (!name) { alert('名前を入れてください。'); return; }
  if (editing) { editing.name = name; editing.color = pickedColor; }
  else data.habits.push({ id: 'h' + Date.now() + Math.random().toString(36).slice(2, 6), name, color: pickedColor, createdAt: Date.now() });
  save(KEY_DATA, data);
  closeSheet('edit');
  if (editing && $('detail').classList.contains('open')) openDetail(editing, true);
  render();
};
$('e-del').onclick = () => {
  if (!editing || !confirm('「' + editing.name + '」と、その記録をすべて削除します。元に戻せません。よろしいですか？')) return;
  data.habits = data.habits.filter((h) => h.id !== editing.id);
  delete data.done[editing.id];
  save(KEY_DATA, data);
  closeSheet('edit'); closeSheet('detail');
  render();
};

// ===== 詳細（カレンダー） =====
let detailHabit = null, calY = 0, calM = 0;
function openDetail(h, keepMonth) {
  detailHabit = h;
  if (!keepMonth) { const n = new Date(); calY = n.getFullYear(); calM = n.getMonth(); }
  $('detail').style.setProperty('--hc', h.color);
  $('d-title').textContent = h.name;
  renderDetail();
  $('detail').classList.add('open');
  if (!keepMonth) window.scrollTo(0, 0);
}
function renderDetail() {
  const h = detailHabit, s = doneSet(h.id), t = todayStr();
  $('d-streak').textContent = currentStreak(h.id);
  $('d-best').textContent = bestStreak(h.id);
  $('d-total').textContent = s.size;
  $('d-month').textContent = calY + '年' + (calM + 1) + '月';
  const g = $('d-grid'); g.innerHTML = '';
  WEEK.forEach((w) => g.append(el('div', 'wd', w)));
  const firstDow = new Date(calY, calM, 1).getDay();
  for (let i = 0; i < firstDow; i++) g.append(el('div'));
  const days = new Date(calY, calM + 1, 0).getDate();
  for (let d = 1; d <= days; d++) {
    const key = ymd(new Date(calY, calM, d));
    const c = el('div', 'day' + (s.has(key) ? ' on' : '') + (key === t ? ' today' : '') + (key > t ? ' future' : ''), String(d));
    c.dataset.day = key;
    c.onclick = () => { if (key > t) return; setDone(h.id, key, !doneSet(h.id).has(key)); renderDetail(); render(); };
    g.append(c);
  }
  const r = monthRate(h, calY, calM);
  $('d-rate').textContent = r ? 'この月の達成：' + r.done + '日 ／ ' + r.days + '日（' + r.pct + '%）' : 'この月は記録の対象外です（登録前・または先の月）';
  const n = new Date();
  $('d-next').disabled = calY > n.getFullYear() || (calY === n.getFullYear() && calM >= n.getMonth());
  $('d-next').style.visibility = $('d-next').disabled ? 'hidden' : 'visible';
}
$('d-prev').onclick = () => { calM--; if (calM < 0) { calM = 11; calY--; } renderDetail(); };
$('d-next').onclick = () => { calM++; if (calM > 11) { calM = 0; calY++; } renderDetail(); };
$('d-close').onclick = () => closeSheet('detail');
$('d-edit').onclick = () => openEdit(detailHabit);

// ===== 設定：バックアップ =====
$('open-settings').onclick = () => { $('settings').classList.add('open'); window.scrollTo(0, 0); };
$('s-close').onclick = () => closeSheet('settings');
$('export').onclick = async () => {
  const d = new Date();
  const name = 'shukan-backup-' + d.getFullYear() + p2(d.getMonth() + 1) + p2(d.getDate()) + '.json';
  const text = JSON.stringify({ app: 'shukan', version: APP_VERSION, exportedAt: d.toISOString(), data }, null, 1);
  const file = new File([text], name, { type: 'application/json' });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], title: name }); } catch (e) {}
    return;
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(file); a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 10000);
};
$('import-btn').onclick = () => $('import').click();
$('import').onchange = async (e) => {
  const f = e.target.files[0]; e.target.value = '';
  if (!f) return;
  let b;
  try { b = JSON.parse(await f.text()); } catch (err) { alert('ファイルを読み取れませんでした。'); return; }
  if (!b || b.app !== 'shukan' || !b.data || !Array.isArray(b.data.habits)) { alert('このアプリのバックアップファイルではありません。'); return; }
  if (!confirm(b.data.habits.length + '件の習慣を読み込みます。同じ習慣は記録を合わせます（ほかの習慣は消えません）。よろしいですか？')) return;
  for (const h of b.data.habits) {
    if (!h || !h.id) continue;
    if (!data.habits.some((x) => x.id === h.id)) data.habits.push(h);
    data.done[h.id] = [...new Set([...(data.done[h.id] || []), ...((b.data.done || {})[h.id] || [])])].sort();
  }
  save(KEY_DATA, data);
  render();
  alert('読み込みました。');
};

// ===== オフライン動作と更新の受け取り（サービスワーカー） =====
if ('serviceWorker' in navigator) {
  const hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.register('sw.js').then((reg) => {
    const showUpdate = (w) => { $('update').style.display = 'flex'; $('update-btn').onclick = () => w.postMessage('SKIP_WAITING'); };
    if (reg.waiting && navigator.serviceWorker.controller) showUpdate(reg.waiting);
    reg.addEventListener('updatefound', () => {
      const w = reg.installing;
      w.addEventListener('statechange', () => { if (w.state === 'installed' && navigator.serviceWorker.controller) showUpdate(w); });
    });
    document.addEventListener('visibilitychange', () => { if (!document.hidden) reg.update(); });
  });
  let reloaded = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (!hadController || reloaded || $('edit').classList.contains('open')) return; // 入力中は読み込み直さない
    reloaded = true; location.reload();
  });
}

// ===== 起動 =====
$('ver').textContent = APP_VERSION;
render();
// 日付が変わったら（アプリを開き直したとき）表示を更新する
document.addEventListener('visibilitychange', () => { if (!document.hidden) { render(); if ($('detail').classList.contains('open')) renderDetail(); } });
</script>
</body>
</html>
