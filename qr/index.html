<!doctype html>
<!-- このファイルは「QRコード作成」の本体です。URLや文章を入れるとQRコードを作って表示し、画像として保存・共有できます。 -->
<!-- QRコードはこのファイルの中の計算だけで作ります（外部のサービスや部品は使わず、入れた文字はどこにも送信しません）。 -->
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>QRコード作成</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-title" content="QR作成">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#3a4a5c">
<style>
  :root { --bg:#f4f6f8; --card:#fff; --text:#1b2633; --sub:#5a6675; --accent:#3a4a5c; --accent-soft:#e3e8ee; --line:#dde3ea; --danger:#c8372d; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#12171d; --card:#1c232c; --text:#e9eef4; --sub:#9aa6b4; --accent:#8fa6c0; --accent-soft:#25303d; --line:#2b3440; --danger:#ef6b61; }
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif; line-height:1.5; }
  main { max-width:640px; margin:0 auto; padding:calc(12px + env(safe-area-inset-top)) 16px calc(30px + env(safe-area-inset-bottom)); }
  h1 { font-size:1.3rem; margin:4px 0 10px; }
  h2 { font-size:1rem; margin:0 0 8px; color:var(--sub); }
  button { font:inherit; color:inherit; border:none; cursor:pointer; touch-action:manipulation; }
  textarea { font:inherit; color:var(--text); background:var(--card); border:1px solid var(--line); border-radius:12px; padding:10px 12px; width:100%; min-height:6em; resize:vertical; }
  #update { display:none; background:var(--accent); color:#fff; border-radius:12px; padding:10px 14px; margin-bottom:10px; align-items:center; justify-content:space-between; }
  #update button { background:#fff; color:var(--accent); border-radius:99px; padding:6px 14px; font-weight:700; }
  section { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; margin-bottom:12px; }
  .actions { display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }
  .primary { background:var(--accent); color:#fff; border-radius:12px; padding:13px 18px; font-weight:700; }
  .plain { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px 16px; }
  .grow { flex:1; }
  .note { font-size:.8rem; color:var(--sub); margin:8px 0 0; }
  .warn { background:#fff5e0; color:#6b4a00; border-radius:10px; padding:8px 10px; font-size:.82rem; margin-bottom:8px; }
  .err { background:#fde8e6; color:#8a1f17; border-radius:10px; padding:8px 10px; font-size:.88rem; margin-top:8px; display:none; }
  @media (prefers-color-scheme: dark) { .warn { background:#3a2e12; color:#f3dca6; } .err { background:#3d1a17; color:#f7c1bb; } }
  #result { display:none; text-align:center; }
  #qrimg { width:100%; max-width:320px; aspect-ratio:1; image-rendering:pixelated; border-radius:8px; background:#fff; -webkit-touch-callout:default; }
  #qrtext { font-size:.85rem; color:var(--sub); word-break:break-all; margin:6px 0 0; text-align:left; }
  .hist { display:flex; align-items:center; gap:8px; border-top:1px solid var(--line); padding:8px 0; }
  .hist:first-child { border-top:none; }
  .hist .t { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; cursor:pointer; padding:6px 0; }
  .hist button { background:var(--bg); border:1px solid var(--line); border-radius:10px; padding:6px 10px; font-size:.85rem; color:var(--danger); }
  .empty { color:var(--sub); font-size:.88rem; }
  footer { text-align:center; font-size:.78rem; color:var(--sub); margin-top:16px; }
</style>
</head>
<body>
<main>
  <div id="update"><span>新しい版があります</span><button id="update-btn">更新する</button></div>
  <h1>🔳 QRコード作成</h1>

  <section>
    <label for="text"><h2>QRコードにする文字（URL・文章）</h2></label>
    <div class="warn">ほかの人に見せる・配るQRコードには、個人を特定できる情報（住所・電話番号など）を入れないよう注意してください。</div>
    <textarea id="text" placeholder="例：https://example.com/"></textarea>
    <div class="actions">
      <button class="primary grow" id="make">QRコードを作る</button>
      <button class="plain" id="clear">消す</button>
    </div>
    <div class="err" id="err"></div>
  </section>

  <section id="result">
    <img id="qrimg" alt="作ったQRコード">
    <p id="qrtext"></p>
    <div class="actions">
      <button class="primary grow" id="share">画像を共有・保存</button>
    </div>
    <p class="note" id="info"></p>
    <p class="note">画像を長押ししても保存できます。配る前に、スマホのカメラで読み取れるか一度確かめてください。</p>
  </section>

  <section>
    <h2>最近作ったもの（このiPhoneの中だけに保存）</h2>
    <div id="history"></div>
  </section>

  <footer>版 <span id="ver"></span> ・ 入れた文字はこのiPhoneの中だけで処理され、外部に送信されません</footer>
</main>

<script>
// ===== 基本の設定 =====
// アプリを更新するときは、この番号と sw.js の VERSION を同じ番号に上げる
const APP_VERSION = '1.0.0';
const KEY_HISTORY = 'qr:history';   // 最近作った文字（最大20件）
const KEY_LAST = 'qr:last';         // 入力欄に最後に入れていた文字
const $ = (id) => document.getElementById(id);

// =====================================================================
// QRコードを作る計算（JIS X 0510 / ISO/IEC 18004 の手順を自前で実装）
// ・文字はUTF-8のバイト列として入れる（バイト・モード）
// ・誤り訂正レベルは M（約15%の汚れ・欠けまで読める）
// ・型番（大きさ）は 1〜40 のうち、入る一番小さいもの
// ・8種類のマスク（模様の反転）を全部試し、減点が一番少ないものを選ぶ
// =====================================================================
const QR = (() => {
  // 誤り訂正レベルMの「ブロックごとの誤り訂正コード語の数」と「ブロック数」（型番1〜40。先頭は使わない）
  const ECC_PER_BLOCK_M = [0, 10, 16, 26, 18, 24, 16, 18, 22, 22, 26, 30, 22, 22, 24, 24, 28, 28, 26, 26, 26,
    26, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28];
  const NUM_BLOCKS_M = [0, 1, 1, 1, 2, 2, 4, 4, 4, 5, 5, 5, 8, 9, 9, 10, 10, 11, 13, 14, 16,
    17, 17, 18, 20, 21, 23, 25, 26, 28, 29, 31, 33, 35, 37, 38, 40, 43, 45, 47, 49];
  const MAX_VERSION = 40;

  // データを置けるマス目の数（機能パターンを除いたもの）
  function rawModules(v) {
    let n = (16 * v + 128) * v + 64;
    if (v >= 2) {
      const a = Math.floor(v / 7) + 2;
      n -= (25 * a - 10) * a - 55;
      if (v >= 7) n -= 36;
    }
    return n;
  }
  const dataCodewords = (v) => Math.floor(rawModules(v) / 8) - ECC_PER_BLOCK_M[v] * NUM_BLOCKS_M[v];
  // バイト・モードで入るバイト数
  const byteCapacity = (v) => Math.floor((dataCodewords(v) * 8 - 4 - (v < 10 ? 8 : 16)) / 8);

  // ----- リード・ソロモン符号（GF(256)、原始多項式 x^8+x^4+x^3+x^2+1） -----
  const EXP = new Uint8Array(512), LOG = new Uint8Array(256);
  (() => { let x = 1; for (let i = 0; i < 255; i++) { EXP[i] = x; LOG[x] = i; x <<= 1; if (x & 0x100) x ^= 0x11d; } for (let i = 255; i < 512; i++) EXP[i] = EXP[i - 255]; })();
  const mul = (a, b) => (a && b) ? EXP[LOG[a] + LOG[b]] : 0;
  function rsGenerator(deg) {
    let g = [1];
    for (let i = 0; i < deg; i++) {           // g(x) に (x - α^i) を掛ける
      const n = new Array(g.length + 1).fill(0);
      for (let j = 0; j < g.length; j++) { n[j] ^= g[j]; n[j + 1] ^= mul(g[j], EXP[i]); }
      g = n;
    }
    return g;                                 // 先頭が最高次（=1）
  }
  function rsRemainder(data, deg) {
    const g = rsGenerator(deg);
    const r = new Array(deg).fill(0);
    for (const b of data) {
      const f = b ^ r.shift(); r.push(0);
      for (let j = 0; j < deg; j++) r[j] ^= mul(g[j + 1], f);
    }
    return r;
  }

  // ----- 位置合わせパターンの中心座標 -----
  function alignPositions(v) {
    if (v === 1) return [];
    const a = Math.floor(v / 7) + 2, size = v * 4 + 17;
    const step = v === 32 ? 26 : Math.ceil((v * 4 + 4) / (a * 2 - 2)) * 2;
    const res = [6];
    for (let p = size - 7; res.length < a; p -= step) res.splice(1, 0, p);
    return res;
  }

  // ----- 文字列 → 誤り訂正つきのコード語の並び -----
  function makeCodewords(bytes, v) {
    const bits = [];
    const put = (val, len) => { for (let i = len - 1; i >= 0; i--) bits.push((val >>> i) & 1); };
    put(0b0100, 4);                              // バイト・モード
    put(bytes.length, v < 10 ? 8 : 16);          // 文字数（バイト数）
    for (const b of bytes) put(b, 8);
    const cap = dataCodewords(v) * 8;
    put(0, Math.min(4, cap - bits.length));      // 終端
    while (bits.length % 8) bits.push(0);
    for (let pad = 0xec; bits.length < cap; pad ^= 0xec ^ 0x11) put(pad, 8); // 埋め草 11101100 / 00010001
    const data = [];
    for (let i = 0; i < bits.length; i += 8) { let b = 0; for (let j = 0; j < 8; j++) b = (b << 1) | bits[i + j]; data.push(b); }

    // ブロックに分けて、それぞれに誤り訂正コードを付ける
    const nb = NUM_BLOCKS_M[v], ecc = ECC_PER_BLOCK_M[v], raw = Math.floor(rawModules(v) / 8);
    const numShort = nb - raw % nb, shortLen = Math.floor(raw / nb);
    const blocks = [], eccs = [];
    for (let i = 0, k = 0; i < nb; i++) {
      const len = shortLen - ecc + (i < numShort ? 0 : 1);
      const d = data.slice(k, k + len); k += len;
      blocks.push(d); eccs.push(rsRemainder(d, ecc));
    }
    const out = [];
    for (let i = 0; i <= shortLen - ecc; i++) for (const b of blocks) if (i < b.length) out.push(b[i]);
    for (let i = 0; i < ecc; i++) for (const e of eccs) out.push(e[i]);
    return out;
  }

  // ----- マス目に並べる -----
  function encode(text) {
    const bytes = Array.from(new TextEncoder().encode(text));
    let v = 1;
    while (v <= MAX_VERSION && byteCapacity(v) < bytes.length) v++;
    if (v > MAX_VERSION) return { error: 'too-long', bytes: bytes.length, max: byteCapacity(MAX_VERSION) };
    const cw = makeCodewords(bytes, v);
    const size = v * 4 + 17;
    const m = Array.from({ length: size }, () => new Uint8Array(size));   // 1=黒
    const fn = Array.from({ length: size }, () => new Uint8Array(size));  // 1=機能パターン（マスクしない）
    const set = (x, y, dark) => { m[y][x] = dark ? 1 : 0; fn[y][x] = 1; };

    // 位置検出パターン（3つの角の大きな四角）と分離帯
    for (const [cx, cy] of [[3, 3], [size - 4, 3], [3, size - 4]]) {
      for (let dy = -4; dy <= 4; dy++) for (let dx = -4; dx <= 4; dx++) {
        const x = cx + dx, y = cy + dy;
        if (x < 0 || y < 0 || x >= size || y >= size) continue;
        const d = Math.max(Math.abs(dx), Math.abs(dy));
        set(x, y, d !== 2 && d !== 4);
      }
    }
    // タイミングパターン（6行目・6列目の点線）
    for (let i = 8; i < size - 8; i++) { set(6, i, i % 2 === 0); set(i, 6, i % 2 === 0); }
    // 位置合わせパターン（小さな四角）
    const ap = alignPositions(v);
    for (const ay of ap) for (const ax of ap) {
      if ((ax === 6 && ay === 6) || (ax === 6 && ay === size - 7) || (ax === size - 7 && ay === 6)) continue;
      for (let dy = -2; dy <= 2; dy++) for (let dx = -2; dx <= 2; dx++) set(ax + dx, ay + dy, Math.max(Math.abs(dx), Math.abs(dy)) !== 1);
    }
    // 形式情報・型番情報の場所を空けておく（減点の計算では白として扱う）
    for (let i = 0; i < 9; i++) if (i !== 6) { set(8, i, 0); set(i, 8, 0); }   // 6はタイミングパターン
    for (let i = 0; i < 8; i++) { set(size - 1 - i, 8, 0); set(8, size - 1 - i, 0); }
    if (v >= 7) for (let i = 0; i < 18; i++) { const a = size - 11 + i % 3, b = Math.floor(i / 3); set(a, b, 0); set(b, a, 0); }

    // データを右下から2列ずつジグザグに置く
    let k = 0;
    const total = cw.length * 8;
    for (let right = size - 1; right >= 1; right -= 2) {
      if (right === 6) right = 5;
      for (let vert = 0; vert < size; vert++) {
        for (let j = 0; j < 2; j++) {
          const x = right - j, up = ((right + 1) & 2) === 0, y = up ? size - 1 - vert : vert;
          if (!fn[y][x] && k < total) { m[y][x] = (cw[k >>> 3] >>> (7 - (k & 7))) & 1; k++; }
        }
      }
    }

    // 8種類のマスクを試し、減点が一番少ないものを使う（同点なら番号の小さいもの）
    let best = null, bestScore = Infinity, bestMask = 0;
    for (let mask = 0; mask < 8; mask++) {
      const t = applyMask(m, fn, mask, size);
      const s = penalty(t, size);
      if (s < bestScore) { bestScore = s; best = t; bestMask = mask; }
    }
    drawFormat(best, bestMask, size);
    if (v >= 7) drawVersion(best, v, size);
    return { version: v, size, mask: bestMask, modules: best, bytes: bytes.length };
  }

  function maskBit(mask, x, y) {
    switch (mask) {
      case 0: return (x + y) % 2 === 0;
      case 1: return y % 2 === 0;
      case 2: return x % 3 === 0;
      case 3: return (x + y) % 3 === 0;
      case 4: return (Math.floor(x / 3) + Math.floor(y / 2)) % 2 === 0;
      case 5: return (x * y) % 2 + (x * y) % 3 === 0;
      case 6: return ((x * y) % 2 + (x * y) % 3) % 2 === 0;
      default: return ((x + y) % 2 + (x * y) % 3) % 2 === 0;
    }
  }
  function applyMask(m, fn, mask, size) {
    const t = m.map((r) => Uint8Array.from(r));
    for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) if (!fn[y][x] && maskBit(mask, x, y)) t[y][x] ^= 1;
    return t;
  }

  // 減点の計算（同じ色の連続、2×2の固まり、位置検出パターンに似た並び、黒の割合のかたより）
  function penalty(t, size) {
    let s = 0, dark = 0;
    const finderLike = (seq) => {
      let c = 0;
      for (let i = 0; i + 7 <= size; ) {
        if (seq[i] && !seq[i + 1] && seq[i + 2] && seq[i + 3] && seq[i + 4] && !seq[i + 5] && seq[i + 6]) {
          let lightBefore = true, lightAfter = true;
          for (let j = Math.max(0, i - 4); j < i; j++) if (seq[j]) lightBefore = false;
          for (let j = i + 7; j < Math.min(size, i + 11); j++) if (seq[j]) lightAfter = false;
          if (i === 0 || i === size - 7 || lightBefore || lightAfter) { c += 40; i += 7; } else i += 4;
        } else i++;
      }
      return c;
    };
    const runs = (seq) => {
      let c = 0, run = 1;
      for (let i = 1; i < size; i++) {
        if (seq[i] === seq[i - 1]) run++; else { if (run >= 5) c += run - 2; run = 1; }
      }
      if (run >= 5) c += run - 2;
      return c;
    };
    for (let y = 0; y < size; y++) {
      const row = t[y], col = new Uint8Array(size);
      for (let x = 0; x < size; x++) { col[x] = t[x][y]; dark += row[x]; }
      s += runs(row) + runs(col) + finderLike(row) + finderLike(col);
      if (y > 0) for (let x = 1; x < size; x++) {
        const c = row[x];
        if (c === row[x - 1] && c === t[y - 1][x] && c === t[y - 1][x - 1]) s += 3;
      }
    }
    s += 10 * Math.floor(Math.abs(dark * 100 / (size * size) - 50) / 5);
    return s;
  }

  // 形式情報（誤り訂正レベルMとマスク番号。BCH符号つき）
  function drawFormat(t, mask, size) {
    const data = (0 << 3) | mask;              // レベルMは 00
    let r = data;
    for (let i = 0; i < 10; i++) r = (r << 1) ^ ((r >>> 9) * 0x537);
    const bits = ((data << 10) | r) ^ 0x5412;
    const b = (i) => (bits >>> i) & 1;
    const put = (x, y, v) => { t[y][x] = v; };
    for (let i = 0; i <= 5; i++) put(8, i, b(i));
    put(8, 7, b(6)); put(8, 8, b(7)); put(7, 8, b(8));
    for (let i = 9; i < 15; i++) put(14 - i, 8, b(i));
    for (let i = 0; i < 8; i++) put(size - 1 - i, 8, b(i));
    for (let i = 8; i < 15; i++) put(8, size - 15 + i, b(i));
    put(8, size - 8, 1);                       // 常に黒のマス
  }
  // 型番情報（型番7以上。BCH符号つき）
  function drawVersion(t, v, size) {
    let r = v;
    for (let i = 0; i < 12; i++) r = (r << 1) ^ ((r >>> 11) * 0x1f25);
    const bits = (v << 12) | r;
    for (let i = 0; i < 18; i++) {
      const c = (bits >>> i) & 1, a = size - 11 + i % 3, b = Math.floor(i / 3);
      t[b][a] = c; t[a][b] = c;
    }
  }

  return { encode, byteCapacity, MAX_VERSION };
})();

// ===== 画面の動き =====
function load(key, fallback) { try { const t = localStorage.getItem(key); return t ? JSON.parse(t) : fallback; } catch (e) { return fallback; } }
function save(key, v) { try { localStorage.setItem(key, JSON.stringify(v)); } catch (e) {} }
function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; }
const p2 = (n) => String(n).padStart(2, '0');

let current = null;   // 今表示しているQR { text, canvas }

// QRを画像（白い余白つき）に描く
function drawCanvas(q) {
  const quiet = 4;
  const scale = Math.max(4, Math.floor(1024 / (q.size + quiet * 2)));
  const px = (q.size + quiet * 2) * scale;
  const c = document.createElement('canvas');
  c.width = c.height = px;
  const g = c.getContext('2d');
  g.fillStyle = '#fff'; g.fillRect(0, 0, px, px);
  g.fillStyle = '#000';
  for (let y = 0; y < q.size; y++) for (let x = 0; x < q.size; x++) if (q.modules[y][x]) g.fillRect((x + quiet) * scale, (y + quiet) * scale, scale, scale);
  return c;
}

function showError(msg) { $('err').textContent = msg; $('err').style.display = msg ? 'block' : 'none'; }

function make(text, remember) {
  showError('');
  if (!text) { $('result').style.display = 'none'; current = null; showError('文字を入れてください。'); return; }
  const q = QR.encode(text);
  if (q.error) {
    $('result').style.display = 'none'; current = null;
    showError('文字が多すぎて作れません（いま ' + q.bytes + ' バイト。最大 ' + q.max + ' バイト。日本語1文字はおよそ3バイト、英数字は1バイトです）。');
    return;
  }
  const c = drawCanvas(q);
  $('qrimg').src = c.toDataURL('image/png');
  $('qrtext').textContent = text;
  $('info').textContent = '大きさ：' + q.size + '×' + q.size + 'マス（型番' + q.version + '）・汚れや欠けに強さ：標準（M）';
  $('result').style.display = 'block';
  current = { text, canvas: c };
  if (remember) {
    const h = load(KEY_HISTORY, []).filter((t) => t !== text);
    h.unshift(text);
    save(KEY_HISTORY, h.slice(0, 20));
    renderHistory();
  }
}

function renderHistory() {
  const box = $('history'); box.innerHTML = '';
  const h = load(KEY_HISTORY, []);
  if (!h.length) { box.append(el('p', 'empty', 'まだありません。')); return; }
  h.forEach((t, i) => {
    const row = el('div', 'hist');
    const s = el('div', 't', t);
    s.onclick = () => { $('text').value = t; save(KEY_LAST, t); make(t, false); window.scrollTo(0, 0); };
    const del = el('button', '', '削除');
    del.onclick = () => { const a = load(KEY_HISTORY, []); a.splice(i, 1); save(KEY_HISTORY, a); renderHistory(); };
    row.append(s, del);
    box.append(row);
  });
}

$('make').onclick = () => { const t = $('text').value.trim(); make(t, true); };
$('clear').onclick = () => { $('text').value = ''; save(KEY_LAST, ''); $('result').style.display = 'none'; showError(''); current = null; $('text').focus(); };
$('text').addEventListener('input', () => save(KEY_LAST, $('text').value));

$('share').onclick = async () => {
  if (!current) return;
  const d = new Date();
  const name = 'qr-' + d.getFullYear() + p2(d.getMonth() + 1) + p2(d.getDate()) + '-' + p2(d.getHours()) + p2(d.getMinutes()) + '.png';
  const blob = await new Promise((r) => current.canvas.toBlob(r, 'image/png'));
  const file = new File([blob], name, { type: 'image/png' });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file] }); } catch (e) {}
    return;
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(file); a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 10000);
};

// ===== オフライン動作と更新の受け取り（サービスワーカー） =====
if ('serviceWorker' in navigator) {
  const hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.register('sw.js').then((reg) => {
    const showUpdate = (w) => { $('update').style.display = 'flex'; $('update-btn').onclick = () => w.postMessage('SKIP_WAITING'); };
    if (reg.waiting && navigator.serviceWorker.controller) showUpdate(reg.waiting);
    reg.addEventListener('updatefound', () => {
      const w = reg.installing;
      w.addEventListener('statechange', () => { if (w.state === 'installed' && navigator.serviceWorker.controller) showUpdate(w); });
    });
    document.addEventListener('visibilitychange', () => { if (!document.hidden) reg.update(); });
  });
  let reloaded = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (!hadController || reloaded) return;
    reloaded = true; location.reload();
  });
}

// ===== 起動 =====
$('ver').textContent = APP_VERSION;
$('text').value = load(KEY_LAST, '');
if ($('text').value.trim()) make($('text').value.trim(), false);
renderHistory();
</script>
</body>
