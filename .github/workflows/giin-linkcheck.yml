# このファイルは、giin のリンク集を月に1回、自動で点検する設定です（毎月3日の午前10時17分ごろ・日本時間）。
# リンク切れがあると、この点検が「失敗」になり、GitHubから高浜さんにメールで知らせが届きます。
# 点検するだけで、アプリや公開内容は書き換えません。手動でも動かせます（Actions →「giin リンク切れの点検」→ Run workflow）。
name: giin リンク切れの点検
on:
  schedule:
    - cron: '17 1 3 * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linkcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node giin/tools/linkcheck.mjs
