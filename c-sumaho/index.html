<!doctype html>
<!-- このファイルは「スマホ時間ふりかえり」の本体です。1日にスマホを使った時間を記録して、自分で決めた目標とくらべたり、1週間のグラフで見たりできます。 -->
<!-- 入力したことはこの端末の中（localStorage）だけに保存し、外部へは一切送信しません。広告・課金・アカウント登録もありません。 -->
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>スマホ時間ふりかえり</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-title" content="スマホ時間">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#1688a0">
<style>
  :root { --bg:#eef8fa; --card:#fff; --text:#132a30; --sub:#56707a; --accent:#1688a0; --accent-soft:#d8eff4; --line:#d3e5ea; --danger:#c8372d; --over:#e0793a; --ok:#2f9e6b; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0e171a; --card:#172328; --text:#e5f2f5; --sub:#98b2ba; --accent:#4cc0d8; --accent-soft:#18343b; --line:#26383e; --danger:#ef6b61; --over:#f29a5e; --ok:#4cc48b; } }

  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif; line-height:1.55; }
  main { max-width:640px; margin:0 auto; min-height:100vh; min-height:100dvh; display:flex; flex-direction:column; padding:calc(12px + env(safe-area-inset-top)) 16px calc(96px + env(safe-area-inset-bottom)); }
  header { display:flex; align-items:center; justify-content:space-between; gap:8px; margin:4px 0 12px; }
  h1 { font-size:clamp(1.02rem, 5vw, 1.25rem); margin:0; }
  button { font:inherit; color:inherit; border:none; cursor:pointer; touch-action:manipulation; }
  button:disabled { opacity:.45; cursor:default; }
  input, select, textarea { font:inherit; font-size:16px; color:var(--text); background:var(--card); border:1px solid var(--line); border-radius:12px; padding:10px 12px; width:100%; }
  textarea { min-height:6em; resize:vertical; }
  .iconbtn { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:8px 12px; white-space:nowrap; }
  #update { display:none; background:var(--accent); color:#fff; border-radius:14px; padding:10px 14px; margin-bottom:10px; align-items:center; justify-content:space-between; gap:8px; }
  #update button { background:#fff; color:var(--accent); border-radius:99px; padding:6px 14px; font-weight:700; }
  .box { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:14px; margin-bottom:12px; }
  .empty { color:var(--sub); text-align:center; padding:28px 8px; }
  .fab { position:fixed; right:20px; bottom:calc(20px + env(safe-area-inset-bottom)); width:64px; height:64px; border-radius:50%;
         background:var(--accent); color:#fff; font-size:2rem; box-shadow:0 4px 12px rgba(0,0,0,.25); z-index:5; }
  .sheet { position:fixed; inset:0; background:var(--bg); overflow:auto; display:none; z-index:10; }
  .sheet.open { display:block; }
  .sheet .inner { max-width:640px; margin:0 auto; padding:calc(12px + env(safe-area-inset-top)) 16px calc(30px + env(safe-area-inset-bottom)); }
  .sheet h2 { font-size:1.15rem; margin:4px 0 12px; }
  label.f { display:block; font-size:.88rem; color:var(--sub); margin:12px 0 4px; }
  .row2 { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .actions { display:flex; gap:8px; flex-wrap:wrap; margin-top:16px; }
  .primary { background:var(--accent); color:#fff; border-radius:14px; padding:13px 20px; font-weight:700; min-height:48px; }
  .plain { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px 16px; min-height:48px; }
  .wide { width:100%; }
  .danger { color:var(--danger); }
  .note { font-size:.82rem; color:var(--sub); margin:8px 0 0; }
  .warn { background:#fff5e0; color:#6b4a00; border-radius:12px; padding:8px 12px; font-size:.86rem; margin-bottom:6px; }
  .tag { display:inline-block; font-size:.76rem; border-radius:99px; padding:0 8px; margin-right:4px; background:var(--accent-soft); color:var(--accent); }
  .chips { display:flex; flex-wrap:wrap; gap:6px; }
  .chip { background:var(--card); border:1px solid var(--line); border-radius:99px; padding:8px 14px; min-height:40px; }
  .chip.on { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:700; }
  .seg { display:grid; gap:6px; }
  footer { text-align:center; font-size:.78rem; color:var(--sub); margin-top:auto; padding-top:18px; }
  @media (prefers-color-scheme: dark) { .warn { background:#3a2e12; color:#f3dca6; } }


  .today { text-align:center; }
  .today .big { font-size:2.4rem; font-weight:800; color:var(--accent); line-height:1.2; }
  .today .msg { font-size:.95rem; margin-top:4px; }
  .msg.ok { color:var(--ok); } .msg.over { color:var(--over); }
  .chart { display:grid; grid-template-columns:repeat(7,1fr); gap:6px; align-items:end; height:170px; position:relative; margin-top:10px; padding-top:18px; }
  .chart .col { display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%; min-width:0; }
  .chart .bar { width:70%; background:var(--accent); border-radius:6px 6px 0 0; min-height:2px; }
  .chart .bar.over { background:var(--over); }
  .chart .bar.none { background:transparent; border:1px dashed var(--line); border-bottom:none; height:14px !important; }
  .chart .v { font-size:.68rem; color:var(--sub); white-space:nowrap; }
  .chart .goal { position:absolute; left:0; right:0; border-top:2px dashed var(--danger); pointer-events:none; }
  .chart .goal span { position:absolute; left:0; top:-17px; font-size:.68rem; color:var(--danger); background:var(--card); padding:0 3px; }
  .days { display:grid; grid-template-columns:repeat(7,1fr); gap:6px; text-align:center; font-size:.75rem; color:var(--sub); margin-top:4px; }
  .stats { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:12px; }
  .stats div { background:var(--accent-soft); border-radius:12px; padding:8px 10px; font-size:.82rem; }
  .stats b { display:block; font-size:1.15rem; }
  .rec { display:flex; justify-content:space-between; align-items:center; gap:8px; padding:10px 4px; border-bottom:1px dashed var(--line); cursor:pointer; }
  .rec:last-child { border-bottom:none; }
  .rec .u { font-size:.76rem; color:var(--sub); }
  .rec .tm { font-weight:700; white-space:nowrap; }
  .rec .tm.over { color:var(--over); }
  .hm { display:flex; align-items:center; gap:8px; }
  .hm input { width:5.5em; text-align:right; }

</style>
</head>
<body>

<main>
  <div id="update"><span>新しい版があります</span><button id="update-btn">更新する</button></div>
  <header>
    <h1>📱 スマホ時間ふりかえり</h1>
    <button class="iconbtn" id="open-settings">⚙️</button>
  </header>
  <div class="box today">
    <div class="note" style="margin:0" id="t-date"></div>
    <div class="big" id="t-time"></div>
    <div class="msg" id="t-msg"></div>
    <div class="actions" style="justify-content:center"><button class="primary" id="t-rec">今日の時間を入れる</button></div>
  </div>
  <div class="box">
    <b>この1週間</b>
    <div class="chart" id="chart"></div>
    <div class="days" id="days"></div>
    <div class="stats" id="stats"></div>
  </div>
  <div class="box">
    <b>きろく</b>
    <div id="recs"></div>
  </div>
  <footer>版 <span id="ver"></span> ・ データはこの端末の中だけに保存されます（外には送りません）</footer>
</main>

<!-- 記録 -->
<div class="sheet" id="edit">
  <div class="inner">
    <h2 id="edit-title">使った時間を入れる</h2>
    <label class="f" for="e-date">日付</label>
    <input id="e-date" type="date">
    <label class="f">使った時間</label>
    <div class="hm">
      <input id="e-h" inputmode="numeric" maxlength="2" placeholder="0" aria-label="時間"><span>時間</span>
      <input id="e-m" inputmode="numeric" maxlength="2" placeholder="0" aria-label="分"><span>分</span>
    </div>
    <p class="note">スマホの設定にある「使った時間」の画面（iPhoneなら「設定」→「スクリーンタイム」）を見て写すとかんたんです。</p>
    <label class="f">何に使った？（いくつでも）</label>
    <div class="chips" id="e-uses"></div>
    <div class="actions">
      <button class="primary" id="e-save">保存する</button>
      <button class="plain" id="e-cancel">やめる</button>
      <button class="plain danger" id="e-del" hidden>この日のきろくを消す</button>
    </div>
  </div>
</div>

<!-- 設定 -->
<div class="sheet" id="settings">
  <div class="inner">
    <h2>⚙️ 設定</h2>
    <label class="f">1日の目標（自分で決めよう。おうちの人と決めたルールがあれば、それに合わせてね）</label>
    <div class="hm">
      <input id="g-h" inputmode="numeric" maxlength="2" aria-label="目標の時間"><span>時間</span>
      <input id="g-m" inputmode="numeric" maxlength="2" aria-label="目標の分"><span>分</span>
    </div>
    <div class="actions"><button class="primary" id="g-save">目標を保存</button><button class="plain" id="g-clear">目標をなしにする</button></div>
    <p class="note">このアプリは記録と計算をするだけの道具です。時間の長い・短いのよしあしは決めません。</p>
    
    <label class="f" style="margin-top:22px">バックアップ（データの保存）</label>
    <p class="note" style="margin-top:0">ホーム画面のアイコンを消すと、データもすべて消えます。ときどき「書き出す」で「ファイル」アプリなどに保存しておくと安心です。</p>
    <div class="actions">
      <button class="plain" id="export">書き出す</button>
      <button class="plain" id="import-btn">読み込む</button>
      <input type="file" id="import" accept="application/json,.json" hidden>
    </div>
    <label class="f" style="margin-top:22px">きろくを消す</label>
    <div class="actions" style="margin-top:0"><button class="plain danger" id="clear-all">ぜんぶ消す</button></div>
    <div class="actions"><button class="plain" id="s-close">閉じる</button></div>
  </div>
</div>

<script>
// ===== 基本の設定 =====
// アプリを更新するときは、この番号と sw.js の VERSION を同じ番号に上げる
const APP_VERSION = '1.0.0';

// ===== 小さな道具（どのページでも使う） =====
const $ = (id) => document.getElementById(id);
function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; }
function load(key, fallback) { try { const t = localStorage.getItem(key); return t ? JSON.parse(t) : fallback; } catch (e) { return fallback; } }
function save(key, v) {
  try { localStorage.setItem(key, JSON.stringify(v)); return true; }
  catch (e) { alert('保存できませんでした。スマホの空き容量を確認してね。'); return false; }
}
const p2 = (n) => String(n).padStart(2, '0');
const WD = '日月火水木金土';
function dstr(d) { return d.getFullYear() + '-' + p2(d.getMonth() + 1) + '-' + p2(d.getDate()); }
function todayStr() { return dstr(new Date()); }
function parseD(s) {
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || '');
  if (!m) return null;
  const d = new Date(+m[1], +m[2] - 1, +m[3]);
  return (isNaN(d) || d.getMonth() !== +m[2] - 1) ? null : d;
}
function addDays(s, n) { const d = parseD(s); d.setDate(d.getDate() + n); return dstr(d); }
function daysUntil(s) { const d = parseD(s); if (!d) return null; return Math.round((d - parseD(todayStr())) / 86400000); }
function fmtD(s) { const d = parseD(s); return d ? (d.getMonth() + 1) + '/' + d.getDate() + '(' + WD[d.getDay()] + ')' : ''; }
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function str(v, max) { return (typeof v === 'string' ? v : (typeof v === 'number' && isFinite(v) ? String(v) : '')).slice(0, max); }
function openSheet(id) { $(id).classList.add('open'); $(id).scrollTop = 0; }
let closedAt = 0;
function closeSheet(id) { $(id).classList.remove('open'); closedAt = Date.now(); }
// 画面を閉じた直後の2回目のタップ（連打）で、下にある一覧の項目が開かないようにする
document.addEventListener('click', (e) => {
  if (Date.now() - closedAt < 350 && !e.target.closest('.sheet.open')) { e.stopPropagation(); e.preventDefault(); }
}, true);
function anySheetOpen() { return !!document.querySelector('.sheet.open'); }
// 0以上の整数だけを受け付ける（小数・マイナス・文字は null）
function wholeNum(text) { const t = String(text).trim().replace(/[０-９]/g, (c) => String.fromCharCode(c.charCodeAt(0) - 0xFEE0)); return /^\d{1,5}$/.test(t) ? parseInt(t, 10) : null; }

// ===== バックアップ（書き出し・読み込み） =====
async function exportBackup(app, data) {
  const d = new Date();
  const name = app + '-backup-' + d.getFullYear() + p2(d.getMonth() + 1) + p2(d.getDate()) + '.json';
  const text = JSON.stringify({ app, version: APP_VERSION, exportedAt: d.toISOString(), ...data }, null, 1);
  const file = new File([text], name, { type: 'application/json' });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], title: name }); } catch (e) {}
    return;
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(file); a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 10000);
}
// apply(data) は取り込んだ件数のメッセージを返す。ふさわしくないファイルなら null を返す
function setupImport(btnId, inputId, app, check, apply) {
  $(btnId).onclick = () => $(inputId).click();
  $(inputId).onchange = async (e) => {
    const f = e.target.files[0]; e.target.value = '';
    if (!f) return;
    let data;
    try { data = JSON.parse(await f.text()); } catch (err) { alert('ファイルを読み取れませんでした。こわれているかもしれません。'); return; }
    if (!data || typeof data !== 'object' || data.app !== app || !check(data)) { alert('このアプリのバックアップファイルではありません。'); return; }
    const msg = apply(data, true);
    if (!msg || !confirm(msg + '\n同じものはファイルの内容で上書きします（ほかのデータは消えません）。よろしいですか？')) return;
    apply(data, false);
    alert('読み込みました。');
  };
}

// ===== 電波がなくても使えるようにする仕組みと、更新の受け取り（サービスワーカー） =====
if ('serviceWorker' in navigator) {
  const hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.register('sw.js').then((reg) => {
    const showUpdate = (w) => { $('update').style.display = 'flex'; $('update-btn').onclick = () => w.postMessage('SKIP_WAITING'); };
    if (reg.waiting && navigator.serviceWorker.controller) showUpdate(reg.waiting);
    reg.addEventListener('updatefound', () => {
      const w = reg.installing;
      w.addEventListener('statechange', () => { if (w.state === 'installed' && navigator.serviceWorker.controller) showUpdate(w); });
    });
    document.addEventListener('visibilitychange', () => { if (!document.hidden) reg.update(); });
  }).catch(() => {});
  let reloaded = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (!hadController || reloaded || anySheetOpen()) return; // 入力中・れんしゅう中は読み込み直さない
    reloaded = true; location.reload();
  });
}


const KEY_DAYS = 'c-sumaho:days';
const KEY_GOAL = 'c-sumaho:goal';
const USES = ['動画', 'ゲーム', 'SNS・連絡', '勉強・調べもの', '音楽', 'その他'];
let days = load(KEY_DAYS, {}); if (!days || typeof days !== 'object' || Array.isArray(days)) days = {};
let goal = load(KEY_GOAL, null); if (!(Number.isInteger(goal) && goal > 0 && goal <= 1440)) goal = null;

const hm = (m) => { const h = Math.floor(m / 60), r = m % 60; return h ? h + '時間' + (r ? r + '分' : '') : r + '分'; };
const short = (m) => { const h = Math.floor(m / 60), r = m % 60; return h ? h + ':' + p2(r) : r + '分'; };
function cmpMsg(m) {
  if (goal === null) return ['', ''];
  if (m <= goal) return ['ok', '目標（' + hm(goal) + '）以内' + (goal - m ? '・あと' + hm(goal - m) + 'の余り' : '・ぴったり')];
  return ['over', '目標（' + hm(goal) + '）より ' + hm(m - goal) + ' 多かった'];
}

function render() {
  const t = todayStr(), rec = days[t];
  $('t-date').textContent = '今日 ' + fmtD(t);
  $('t-time').textContent = rec ? hm(rec.min) : 'まだ入れていません';
  $('t-time').style.fontSize = rec ? '' : '1.2rem';
  const [c, m] = goal === null ? ['', '⚙️ 設定で1日の目標を決めると、目標とくらべられます。'] : rec ? cmpMsg(rec.min) : ['', '1日の目標：' + hm(goal)];
  $('t-msg').className = 'msg ' + c; $('t-msg').textContent = m;
  $('t-rec').textContent = rec ? '今日の時間を直す' : '今日の時間を入れる';

  // 1週間のグラフ
  const keys = []; for (let i = 6; i >= 0; i--) keys.push(addDays(t, -i));
  const vals = keys.map((k) => days[k] ? days[k].min : null);
  const max = Math.max(60, goal || 0, ...vals.filter((v) => v !== null));
  const ch = $('chart'); ch.innerHTML = '';
  const H = 150; // 棒の部分の高さ(px)
  keys.forEach((k, i) => {
    const col = el('div', 'col'); const v = vals[i];
    if (v !== null) col.append(el('div', 'v', short(v)));
    const b = el('div', 'bar' + (v === null ? ' none' : goal !== null && v > goal ? ' over' : ''));
    if (v !== null) b.style.height = Math.max(2, Math.round(v / max * (H - 18))) + 'px';
    col.append(b); ch.append(col);
  });
  if (goal !== null) {
    const g = el('div', 'goal'); g.style.bottom = Math.round(goal / max * (H - 18)) + 'px';
    g.append(el('span', '', '目標')); ch.append(g);
  }
  const dd = $('days'); dd.innerHTML = '';
  keys.forEach((k) => { const d = parseD(k); dd.append(el('div', '', (k === t ? '今日' : (d.getMonth() + 1) + '/' + d.getDate()) + '\n')); });
  const got = vals.filter((v) => v !== null);
  const st = $('stats'); st.innerHTML = '';
  const add = (label, val) => { const d = el('div'); d.append(el('b', '', val), document.createTextNode(label)); st.append(d); };
  add('入れた日（7日のうち）', got.length + '日');
  add('入れた日の平均', got.length ? hm(Math.round(got.reduce((a, b) => a + b, 0) / got.length)) : '—');
  if (goal !== null) add('目標以内だった日', got.filter((v) => v <= goal).length + '日');
  if (goal !== null) add('目標以内が続いている', streak() + '日');

  // きろくの一覧（新しい順・60日分）
  const box = $('recs'); box.innerHTML = '';
  const all = Object.keys(days).sort().reverse().slice(0, 60);
  if (!all.length) { box.append(el('p', 'empty', 'まだきろくはありません。')); return; }
  all.forEach((k) => {
    const r = el('div', 'rec'), d = days[k];
    const l = el('div'); l.append(el('div', '', fmtD(k) + (k === t ? '（今日）' : '')));
    if (d.uses.length) l.append(el('div', 'u', d.uses.join('・')));
    r.append(l, el('div', 'tm' + (goal !== null && d.min > goal ? ' over' : ''), hm(d.min)));
    r.onclick = () => openEdit(k);
    box.append(r);
  });
}
// 今日（入れていなければ昨日）から、目標以内の日がとぎれずに続いている日数
function streak() {
  let k = todayStr(); if (!days[k]) k = addDays(k, -1);
  let n = 0;
  while (days[k] && days[k].min <= goal && n < 400) { n++; k = addDays(k, -1); }
  return n;
}

// ===== 記録 =====
let selUses = [], busy = false;
function openEdit(k) {
  const d = days[k];
  $('edit-title').textContent = d ? 'きろくを直す' : '使った時間を入れる';
  $('e-date').value = k; $('e-date').max = todayStr();
  $('e-h').value = d ? Math.floor(d.min / 60) : ''; $('e-m').value = d ? d.min % 60 : '';
  selUses = d ? d.uses.slice() : [];
  drawUses();
  $('e-del').hidden = !d;
  openSheet('edit');
}
function drawUses() {
  const box = $('e-uses'); box.innerHTML = '';
  USES.forEach((u) => { const b = el('button', 'chip' + (selUses.includes(u) ? ' on' : ''), u); b.onclick = () => { selUses = selUses.includes(u) ? selUses.filter((x) => x !== u) : [...selUses, u]; drawUses(); }; box.append(b); });
}
$('e-date').onchange = () => { const k = $('e-date').value; if (days[k]) openEdit(k); else $('e-del').hidden = true; };
// 時間と分を読み取る。正しくなければ null（理由は alert で伝える）
function readHM(hId, mId) {
  const hs = $(hId).value.trim(), ms = $(mId).value.trim();
  if (hs === '' && ms === '') { alert('時間か分を入れてね。'); return null; }
  const h = hs === '' ? 0 : wholeNum(hs), m = ms === '' ? 0 : wholeNum(ms);
  if (h === null || m === null) { alert('時間と分は、0以上の整数で入れてね（小数やマイナスは入れられません）。'); return null; }
  if (m > 59) { alert('分は 0 から 59 までで入れてね。'); return null; }
  if (h * 60 + m > 1440) { alert('1日は24時間までです。入れ直してね。'); return null; }
  return h * 60 + m;
}
$('t-rec').onclick = () => openEdit(todayStr());
$('e-cancel').onclick = () => closeSheet('edit');
$('e-save').onclick = () => {
  if (busy) return;
  const k = $('e-date').value;
  if (!parseD(k)) { alert('日付を選んでね。'); return; }
  if (k > todayStr()) { alert('まだ来ていない日は入れられません。'); return; }
  const min = readHM('e-h', 'e-m'); if (min === null) return;
  busy = true; setTimeout(() => { busy = false; }, 400);
  days[k] = { min, uses: selUses.filter((u) => USES.includes(u)) };
  save(KEY_DAYS, days); closeSheet('edit'); render();
};
$('e-del').onclick = () => {
  const k = $('e-date').value;
  if (!days[k] || !confirm(fmtD(k) + 'のきろくを消します。いい？')) return;
  delete days[k]; save(KEY_DAYS, days); closeSheet('edit'); render();
};

// ===== 設定 =====
$('open-settings').onclick = () => { $('g-h').value = goal === null ? '' : Math.floor(goal / 60); $('g-m').value = goal === null ? '' : goal % 60; openSheet('settings'); };
$('s-close').onclick = () => { closeSheet('settings'); render(); };
$('g-save').onclick = () => {
  const v = readHM('g-h', 'g-m'); if (v === null) return;
  if (v === 0) { alert('目標は1分以上で入れてね。目標を使わないときは「目標をなしにする」を押してね。'); return; }
  goal = v; save(KEY_GOAL, goal); render(); alert('目標を ' + hm(goal) + ' にしました。');
};
$('g-clear').onclick = () => { goal = null; save(KEY_GOAL, null); $('g-h').value = ''; $('g-m').value = ''; render(); alert('目標をなしにしました。'); };
$('clear-all').onclick = () => {
  if (!Object.keys(days).length || !confirm('きろくをぜんぶ消します。元にもどせません。いい？')) return;
  days = {}; save(KEY_DAYS, days); render(); alert('消しました。');
};
$('export').onclick = () => exportBackup('c-sumaho', { days, goal });
setupImport('import-btn', 'import', 'c-sumaho', (d) => d.days && typeof d.days === 'object' && !Array.isArray(d.days), (d, dry) => {
  const ok = {};
  Object.keys(d.days).forEach((k) => {
    const v = d.days[k];
    if (parseD(k) && v && Number.isInteger(v.min) && v.min >= 0 && v.min <= 1440)
      ok[k] = { min: v.min, uses: Array.isArray(v.uses) ? v.uses.filter((u) => USES.includes(u)) : [] };
  });
  const n = Object.keys(ok).length;
  if (dry) return n ? n + '日分のきろくを読み込みます。' : (alert('読み込めるきろくがありませんでした。'), null);
  Object.assign(days, ok); save(KEY_DAYS, days);
  if (Number.isInteger(d.goal) && d.goal > 0 && d.goal <= 1440 && goal === null) { goal = d.goal; save(KEY_GOAL, goal); }
  render(); return 'ok';
});

document.addEventListener('visibilitychange', () => { if (!document.hidden && !anySheetOpen()) render(); });
$('ver').textContent = APP_VERSION;
render();

</script>
