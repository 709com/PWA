<!doctype html>
<!-- このファイルは「発言時間の配分計算」の本体です。持ち時間と質問項目（比重または分数）を入れると、各項目の目安時間と合計・余りを計算し、名前をつけて保存・文章で共有できます。 -->
<!-- 入力した内容はiPhoneの中（localStorage＝ブラウザの小さな保存場所）だけに保存し、外部へは一切送信しません。 -->
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>発言時間の配分計算</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-title" content="時間配分">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#2e7d4f">
<style>
  :root { --bg:#f3f8f5; --card:#fff; --text:#1a2a21; --sub:#566b5f; --accent:#2e7d4f; --accent-soft:#dff0e6; --line:#dbe6df; --danger:#c8372d; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#111915; --card:#1a241f; --text:#e8f2ec; --sub:#99ada1; --accent:#5ec48a; --accent-soft:#1b3a28; --line:#2a3a31; --danger:#ef6b61; }
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif; line-height:1.5; }
  main { max-width:640px; margin:0 auto; padding:calc(12px + env(safe-area-inset-top)) 16px calc(30px + env(safe-area-inset-bottom)); }
  header { display:flex; align-items:center; justify-content:space-between; gap:8px; margin:4px 0 10px; }
  h1 { font-size:1.3rem; margin:0; }
  h3 { font-size:.95rem; color:var(--sub); margin:16px 0 8px; }
  button { font:inherit; color:inherit; border:none; cursor:pointer; touch-action:manipulation; }
  input, select { font:inherit; color:var(--text); background:var(--card); border:1px solid var(--line); border-radius:10px; padding:9px 10px; width:100%; min-width:0; }
  .iconbtn { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:7px 12px; white-space:nowrap; }
  #update { display:none; background:var(--accent); color:#fff; border-radius:12px; padding:10px 14px; margin-bottom:10px; align-items:center; justify-content:space-between; }
  #update button { background:#fff; color:var(--accent); border-radius:99px; padding:6px 14px; font-weight:700; }

  label.f { display:block; font-size:.85rem; color:var(--sub); margin:10px 0 4px; }
  .row2 { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .row2 > div { min-width:0; }
  .unit { display:flex; align-items:center; gap:6px; }
  .unit span { color:var(--sub); white-space:nowrap; }
  #total { font-size:1.4rem; font-weight:700; }

  /* 項目 */
  .item { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:10px 12px; margin-bottom:8px; }
  .item .r1 { display:flex; align-items:center; gap:8px; }
  .item .no { width:28px; height:28px; border-radius:50%; background:var(--accent-soft); color:var(--accent); font-weight:700; display:flex; align-items:center; justify-content:center; flex:none; font-size:.9rem; }
  .item .r2 { display:grid; grid-template-columns:auto 1fr auto auto; gap:6px; align-items:center; margin-top:8px; }
  .seg { display:flex; border:1px solid var(--line); border-radius:10px; overflow:hidden; }
  .seg button { background:var(--card); padding:9px 10px; font-size:.85rem; white-space:nowrap; }
  .seg button.on { background:var(--accent); color:#fff; font-weight:700; }
  .mv { background:var(--bg); border:1px solid var(--line); border-radius:10px; width:42px; height:42px; font-size:1rem; }
  .mv:disabled { opacity:.3; }
  .del { background:none; color:var(--danger); font-size:1.2rem; width:40px; height:40px; flex:none; }
  .item .res { display:flex; align-items:center; gap:10px; margin-top:8px; }
  .item .res b { font-size:1.15rem; white-space:nowrap; font-variant-numeric:tabular-nums; min-width:6.5em; }
  .bar { flex:1; height:10px; background:var(--accent-soft); border-radius:99px; overflow:hidden; }
  .bar div { height:100%; background:var(--accent); border-radius:99px; width:0; }

  .add { width:100%; background:var(--card); border:1px dashed var(--accent); color:var(--accent); border-radius:12px; padding:12px; font-weight:700; }

  /* 合計・余り */
  .sum { background:var(--accent); color:#fff; border-radius:16px; padding:14px 16px; margin-top:14px; display:grid; grid-template-columns:1fr 1fr 1fr; text-align:center; gap:4px; }
  .sum div small { display:block; font-size:.78rem; opacity:.9; }
  .sum div b { font-size:1.2rem; font-variant-numeric:tabular-nums; }
  .sum.over { background:var(--danger); }
  .msg { font-size:.85rem; color:var(--sub); margin:6px 0 0; text-align:center; }

  .actions { display:flex; gap:8px; flex-wrap:wrap; margin-top:14px; }
  .primary { background:var(--accent); color:#fff; border-radius:12px; padding:12px 18px; font-weight:700; }
  .plain { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px 16px; }
  .danger { color:var(--danger); }
  .note { font-size:.8rem; color:var(--sub); margin:8px 0 0; }

  /* 保存した案の画面 */
  .sheet { position:fixed; inset:0; background:var(--bg); overflow:auto; display:none; z-index:10; }
  .sheet.open { display:block; }
  .sheet .inner { max-width:640px; margin:0 auto; padding:calc(12px + env(safe-area-inset-top)) 16px calc(30px + env(safe-area-inset-bottom)); }
  .sheet h2 { font-size:1.15rem; margin:4px 0 12px; }
  .plan { display:flex; align-items:center; gap:8px; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:10px 12px; margin-bottom:8px; }
  .plan .b { flex:1; min-width:0; cursor:pointer; }
  .plan .t { font-weight:700; word-break:break-word; }
  .plan .m { font-size:.8rem; color:var(--sub); }
  .empty { color:var(--sub); text-align:center; padding:24px 0; }
  footer { text-align:center; font-size:.78rem; color:var(--sub); margin-top:18px; }
</style>
</head>
<body>
<main>
  <div id="update"><span>新しい版があります</span><button id="update-btn">更新する</button></div>
  <header>
    <h1>⏱️ 時間配分</h1>
    <button class="iconbtn" id="open-plans">📂 保存した案</button>
  </header>

  <label class="f" for="name">案の名前（保存するときに使います）</label>
  <input id="name" maxlength="40" placeholder="例：11月定例会 一般質問">
  <div class="row2">
    <div><label class="f" for="total">持ち時間</label><div class="unit"><input id="total" type="number" inputmode="decimal" min="0" step="any" placeholder="0"><span>分</span></div></div>
    <div><label class="f" for="reserve">予備にとっておく時間</label><div class="unit"><input id="reserve" type="number" inputmode="decimal" min="0" step="any" placeholder="0"><span>分</span></div></div>
  </div>

  <h3>質問の項目</h3>
  <p class="note" style="margin:-4px 0 8px">「分」は時間を決めて確保します。「比重」は、残りの時間を比重の大きさで分けます（例：2と1なら 2:1）。</p>
  <div id="items"></div>
  <button class="add" id="add-item">＋ 項目を追加</button>

  <div class="sum" id="sum">
    <div><small>持ち時間</small><b id="s-total">0分</b></div>
    <div><small>合計</small><b id="s-used">0分</b></div>
    <div><small id="s-left-l">余り</small><b id="s-left">0分</b></div>
  </div>
  <p class="msg" id="msg"></p>

  <div class="actions">
    <button class="primary" id="save-plan">💾 この案を保存</button>
    <button class="plain" id="share">📤 文章で共有</button>
    <button class="plain" id="new-plan">新しく作る</button>
  </div>
  <footer>版 <span id="ver"></span> ・ データはこのiPhoneの中だけに保存されます<br>目安の時間は10秒単位で切り捨てて表示します。</footer>
</main>

<!-- 保存した案 -->
<div class="sheet" id="plans">
  <div class="inner">
    <h2>📂 保存した案</h2>
    <div id="plan-list"></div>
    <div class="actions"><button class="plain" id="p-close">閉じる</button></div>
  </div>
</div>

<script>
// ===== 基本の設定 =====
// アプリを更新するときは、この番号と sw.js の VERSION を同じ番号に上げる
const APP_VERSION = '1.0.0';
const KEY_CUR = 'haibun:current';   // いま画面に出している案
const KEY_PLANS = 'haibun:plans';   // 名前をつけて保存した案
const $ = (id) => document.getElementById(id);

// ===== 小さな道具 =====
function load(key, fallback) { try { const t = localStorage.getItem(key); return t ? JSON.parse(t) : fallback; } catch (e) { return fallback; } }
function save(key, v) { try { localStorage.setItem(key, JSON.stringify(v)); return true; } catch (e) { return false; } }
function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; }
const p2 = (n) => String(n).padStart(2, '0');
function fmtDate(ms) { const d = new Date(ms); return d.getFullYear() + '/' + (d.getMonth() + 1) + '/' + d.getDate() + ' ' + p2(d.getHours()) + ':' + p2(d.getMinutes()); }
// 全角数字も読めるようにして数にする（読めなければ0）
function num(v) { const n = parseFloat(String(v == null ? '' : v).replace(/[０-９．]/g, (c) => String.fromCharCode(c.charCodeAt(0) - 0xFEE0))); return isFinite(n) && n > 0 ? n : 0; }
// 秒を「○分○秒」に
function fmt(sec) { sec = Math.round(Math.abs(sec)); const m = Math.floor(sec / 60), s = sec % 60; return s ? (m ? m + '分' : '') + s + '秒' : m + '分'; }
function blankPlan() { return { name: '', total: '', reserve: '', items: [{ name: '', mode: 'w', value: '1' }, { name: '', mode: 'w', value: '1' }] }; }

let plan = load(KEY_CUR, null) || blankPlan();
if (!Array.isArray(plan.items)) plan = blankPlan();

// ===== 計算 =====
// 「分」の項目は先に確保し、持ち時間から予備と「分」の合計を引いた残りを、比重で分ける（10秒単位で切り捨て）
function calc() {
  const total = num(plan.total) * 60, reserve = num(plan.reserve) * 60;
  const fixed = plan.items.reduce((a, it) => a + (it.mode === 'm' ? num(it.value) * 60 : 0), 0);
  const wsum = plan.items.reduce((a, it) => a + (it.mode === 'w' ? num(it.value) : 0), 0);
  const pool = Math.max(0, total - reserve - fixed);
  const secs = plan.items.map((it) => it.mode === 'm' ? Math.round(num(it.value) * 60) : (wsum ? Math.floor(pool * num(it.value) / wsum / 10) * 10 : 0));
  const used = secs.reduce((a, b) => a + b, 0);
  return { total, reserve, fixed, wsum, secs, used, left: total - used };
}

// ===== 画面の表示 =====
function persist() { save(KEY_CUR, plan); }
function buildItems() {
  const box = $('items'); box.innerHTML = '';
  plan.items.forEach((it, i) => {
    const card = el('div', 'item');
    const r1 = el('div', 'r1');
    const name = el('input'); name.value = it.name; name.maxLength = 40; name.placeholder = '項目の名前（例：' + ['防災', '子育て支援', '教育', '高齢者福祉'][i % 4] + 'について）';
    name.setAttribute('aria-label', (i + 1) + '番目の項目の名前');
    name.oninput = () => { it.name = name.value; persist(); };
    const del = el('button', 'del', '✕'); del.setAttribute('aria-label', 'この項目を削除');
    del.onclick = () => { if ((it.name || it.value) && !confirm('「' + (it.name || (i + 1) + '番目の項目') + '」を削除しますか？')) return; plan.items.splice(i, 1); persist(); buildItems(); };
    r1.append(el('div', 'no', String(i + 1)), name, del);

    const r2 = el('div', 'r2');
    const seg = el('div', 'seg');
    [['w', '比重'], ['m', '分']].forEach(([m, label]) => {
      const b = el('button', it.mode === m ? 'on' : '', label);
      b.onclick = () => { if (it.mode === m) return; it.mode = m; persist(); buildItems(); };
      seg.append(b);
    });
    const val = el('input'); val.type = 'number'; val.inputMode = 'decimal'; val.min = '0'; val.step = 'any'; val.value = it.value;
    val.setAttribute('aria-label', (i + 1) + '番目の項目の' + (it.mode === 'm' ? '分数' : '比重'));
    val.placeholder = it.mode === 'm' ? '分' : '比重';
    val.oninput = () => { it.value = val.value; persist(); update(); };
    const up = el('button', 'mv', '▲'); up.disabled = i === 0; up.setAttribute('aria-label', '上へ');
    const dn = el('button', 'mv', '▼'); dn.disabled = i === plan.items.length - 1; dn.setAttribute('aria-label', '下へ');
    up.onclick = () => move(i, -1); dn.onclick = () => move(i, 1);
    r2.append(seg, val, up, dn);

    const res = el('div', 'res');
    res.append(el('b', 'out'), el('div', 'bar'));
    res.lastChild.append(el('div'));
    card.append(r1, r2, res);
    box.append(card);
  });
  update();
}
function move(i, d) {
  const j = i + d;
  if (j < 0 || j >= plan.items.length) return;
  [plan.items[i], plan.items[j]] = [plan.items[j], plan.items[i]];
  persist(); buildItems();
}
function update() {
  const r = calc();
  const cards = $('items').children;
  r.secs.forEach((s, i) => {
    const c = cards[i]; if (!c) return;
    c.querySelector('.out').textContent = '目安 ' + fmt(s);
    c.querySelector('.bar div').style.width = (r.total ? Math.min(100, s / r.total * 100) : 0) + '%';
  });
  $('s-total').textContent = fmt(r.total);
  $('s-used').textContent = fmt(r.used);
  $('s-left-l').textContent = r.left < 0 ? '超過' : '余り';
  $('s-left').textContent = fmt(r.left);
  $('sum').classList.toggle('over', r.left < 0);
  let msg = '';
  if (!r.total) msg = '持ち時間を入れてください。';
  else if (r.left < 0) msg = '「分」の項目と予備の合計が、持ち時間を ' + fmt(-r.left) + ' 超えています。';
  else if (r.reserve) msg = '余りには、予備の ' + fmt(r.reserve) + ' を含みます。';
  if (r.total && r.left >= 0 && plan.items.some((it) => it.mode === 'w' && num(it.value)) && r.total - r.reserve - r.fixed <= 0) msg = '比重で分ける残りの時間がありません。';
  $('msg').textContent = msg;
}
function fillForm() {
  $('name').value = plan.name || '';
  $('total').value = plan.total;
  $('reserve').value = plan.reserve;
  buildItems();
}
$('name').oninput = () => { plan.name = $('name').value; persist(); };
$('total').oninput = () => { plan.total = $('total').value; persist(); update(); };
$('reserve').oninput = () => { plan.reserve = $('reserve').value; persist(); update(); };
$('add-item').onclick = () => {
  plan.items.push({ name: '', mode: 'w', value: '1' }); persist(); buildItems();
  const ins = $('items').querySelectorAll('.r1 input'); ins[ins.length - 1].focus();
};

// ===== 共有（文章） =====
function shareText() {
  const r = calc();
  const lines = ['【発言時間の配分】' + (plan.name ? plan.name : ''), '持ち時間 ' + fmt(r.total) + (r.reserve ? '（予備 ' + fmt(r.reserve) + '）' : ''), ''];
  plan.items.forEach((it, i) => lines.push((i + 1) + '. ' + (it.name || '（名前なし）') + ' … ' + fmt(r.secs[i]) + (it.mode === 'w' ? '（比重 ' + num(it.value) + '）' : '（時間を指定）')));
  lines.push('', '合計 ' + fmt(r.used) + ' ／ ' + (r.left < 0 ? '超過 ' : '余り ') + fmt(r.left));
  return lines.join('\n');
}
$('share').onclick = async () => {
  const text = shareText();
  if (navigator.share) { try { await navigator.share({ title: plan.name || '発言時間の配分', text }); } catch (e) {} return; }
  try { await navigator.clipboard.writeText(text); alert('コピーしました。'); } catch (e) { prompt('この文章をコピーしてください', text); }
};

// ===== 保存した案 =====
let plans = load(KEY_PLANS, []);
if (!Array.isArray(plans)) plans = [];
$('save-plan').onclick = () => {
  let name = (plan.name || '').trim();
  if (!name) {
    name = (prompt('この案の名前を入れてください', '') || '').trim().slice(0, 40);
    if (!name) return;
    plan.name = name; $('name').value = name; persist();
  }
  const i = plans.findIndex((p) => p.name === name);
  if (i >= 0 && !confirm('「' + name + '」はすでに保存されています。上書きしますか？')) return;
  const copy = JSON.parse(JSON.stringify(plan)); copy.savedAt = Date.now();
  if (i >= 0) plans[i] = copy; else plans.unshift(copy);
  if (!save(KEY_PLANS, plans)) { alert('保存できませんでした。'); return; }
  alert('「' + name + '」を保存しました。');
};
function buildPlans() {
  const box = $('plan-list'); box.innerHTML = '';
  if (!plans.length) { box.append(el('p', 'empty', 'まだ保存した案はありません。')); return; }
  plans.forEach((p, i) => {
    const row = el('div', 'plan');
    const b = el('div', 'b');
    b.append(el('div', 't', p.name), el('div', 'm', '持ち時間 ' + fmt(num(p.total) * 60) + ' ・ ' + p.items.length + '項目 ・ 保存 ' + fmtDate(p.savedAt)));
    b.onclick = () => { plan = JSON.parse(JSON.stringify(p)); delete plan.savedAt; persist(); fillForm(); $('plans').classList.remove('open'); window.scrollTo(0, 0); };
    const open = el('button', 'plain', '開く'); open.onclick = b.onclick;
    const del = el('button', 'plain danger', '削除');
    del.onclick = () => { if (!confirm('「' + p.name + '」を削除します。よろしいですか？')) return; plans.splice(i, 1); save(KEY_PLANS, plans); buildPlans(); };
    row.append(b, open, del);
    box.append(row);
  });
}
$('open-plans').onclick = () => { buildPlans(); $('plans').classList.add('open'); window.scrollTo(0, 0); };
$('p-close').onclick = () => $('plans').classList.remove('open');
$('new-plan').onclick = () => {
  if (!confirm('いまの入力を消して、新しく作りますか？（保存した案は消えません）')) return;
  plan = blankPlan(); persist(); fillForm();
};

// ===== オフライン動作と更新の受け取り（サービスワーカー） =====
if ('serviceWorker' in navigator) {
  const hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.register('sw.js').then((reg) => {
    const showUpdate = (w) => { $('update').style.display = 'flex'; $('update-btn').onclick = () => w.postMessage('SKIP_WAITING'); };
    if (reg.waiting && navigator.serviceWorker.controller) showUpdate(reg.waiting);
    reg.addEventListener('updatefound', () => {
      const w = reg.installing;
      w.addEventListener('statechange', () => { if (w.state === 'installed' && navigator.serviceWorker.controller) showUpdate(w); });
    });
    document.addEventListener('visibilitychange', () => { if (!document.hidden) reg.update(); });
  });
  let reloaded = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (!hadController || reloaded) return; // 入力した内容はその都度保存しているので、読み込み直しても消えない
    reloaded = true; location.reload();
  });
}

// ===== 起動 =====
$('ver').textContent = APP_VERSION;
fillForm();
</script>
</body>
</html>
