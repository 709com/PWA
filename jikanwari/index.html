<!doctype html>
<!-- このファイルは「時間割ノート」の本体です。子どもごとの時間割（月〜金・1〜6時間目）と曜日ごとの持ち物メモを記録し、今日・明日の時間割を大きく表示します。 -->
<!-- 記録はiPhoneの中（localStorage＝ブラウザの小さな保存場所）だけに保存し、外部へは一切送信しません。 -->
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>時間割ノート</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-title" content="時間割">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#2f7d4f">
<style>
  :root { --bg:#f3f8f4; --card:#fff; --text:#1b2a20; --sub:#5a6a60; --accent:#2f7d4f; --accent-soft:#e0f0e6; --line:#dbe5de; --danger:#c8372d;
          --sl:90%; --sd:24%; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#111814; --card:#1b241e; --text:#e8f1eb; --sub:#9ab0a2; --accent:#6cc290; --accent-soft:#1d3527; --line:#2a372f; --danger:#ef6b61;
            --sl:24%; --sd:86%; }
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif; line-height:1.5; }
  main { max-width:640px; margin:0 auto; padding:calc(12px + env(safe-area-inset-top)) 16px calc(30px + env(safe-area-inset-bottom)); }
  header { display:flex; align-items:center; justify-content:space-between; gap:8px; margin:4px 0 10px; }
  h1 { font-size:1.3rem; margin:0; }
  button { font:inherit; color:inherit; border:none; cursor:pointer; touch-action:manipulation; }
  input, select, textarea { font:inherit; font-size:16px; color:var(--text); background:var(--card); border:1px solid var(--line); border-radius:10px; padding:9px 10px; width:100%; }
  textarea { min-height:5em; resize:vertical; }
  .iconbtn { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:8px 12px; white-space:nowrap; }
  #update { display:none; background:var(--accent); color:#fff; border-radius:12px; padding:10px 14px; margin-bottom:10px; align-items:center; justify-content:space-between; }
  #update button { background:#fff; color:var(--accent); border-radius:99px; padding:6px 14px; font-weight:700; }

  /* 子どもの切り替え */
  .kids { display:flex; gap:6px; overflow-x:auto; padding-bottom:4px; margin-bottom:10px; }
  .kids button { flex:0 0 auto; background:var(--card); border:2px solid var(--line); border-radius:99px; padding:9px 16px; font-weight:700; min-height:44px; }
  .kids button.on { background:var(--accent); border-color:var(--accent); color:#fff; }

  /* 今日・明日 */
  .day { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:14px; margin-bottom:12px; }
  .day h2 { margin:0 0 8px; font-size:1.15rem; display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; }
  .day h2 small { font-size:.85rem; color:var(--sub); font-weight:500; }
  .day.today h2 { font-size:1.35rem; }
  .per { display:flex; align-items:center; gap:10px; margin:6px 0; }
  .per .n { width:4.4em; flex:0 0 auto; color:var(--sub); font-size:.9rem; text-align:right; }
  .subj { display:inline-block; border-radius:10px; padding:4px 12px; font-weight:700; background:hsl(var(--h) 65% var(--sl)); color:hsl(var(--h) 60% var(--sd)); word-break:break-all; }
  .today .subj { font-size:1.25rem; padding:6px 14px; }
  .subj.none { background:transparent; color:var(--sub); font-weight:400; }
  .rest { font-size:1.6rem; font-weight:700; text-align:center; padding:14px 0; }
  .memo { margin-top:10px; background:var(--accent-soft); border-radius:10px; padding:8px 12px; white-space:pre-wrap; word-break:break-word; }
  .memo b { display:block; font-size:.8rem; color:var(--accent); }
  .empty { color:var(--sub); text-align:center; padding:12px 0; margin:0; }

  /* 1週間の表 */
  .week { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:10px; margin-bottom:12px; }
  .week h3 { margin:2px 4px 8px; font-size:1rem; }
  table { width:100%; border-collapse:separate; border-spacing:3px; table-layout:fixed; }
  th { font-size:.8rem; color:var(--sub); font-weight:600; }
  th.now { color:var(--accent); }
  td { font-size:.78rem; text-align:center; border-radius:8px; padding:6px 1px; word-break:break-all; line-height:1.25; background:hsl(var(--h) 65% var(--sl)); color:hsl(var(--h) 60% var(--sd)); font-weight:700; }
  td.blank { background:var(--bg); color:var(--sub); font-weight:400; }
  td.num { background:transparent; color:var(--sub); font-weight:400; width:1.6em; }
  .bigbtn { display:block; width:100%; background:var(--accent); color:#fff; border-radius:14px; padding:14px; font-weight:700; font-size:1.05rem; margin-bottom:12px; }

  /* 編集・設定の画面（全面） */
  .sheet { position:fixed; inset:0; background:var(--bg); overflow:auto; display:none; z-index:10; }
  .sheet.open { display:block; }
  .sheet .inner { max-width:640px; margin:0 auto; padding:calc(12px + env(safe-area-inset-top)) 16px calc(30px + env(safe-area-inset-bottom)); }
  .sheet h2 { font-size:1.15rem; margin:4px 0 12px; }
  label.f { display:block; font-size:.85rem; color:var(--sub); margin:10px 0 4px; }
  .daytabs { display:grid; grid-template-columns:repeat(5,1fr); gap:6px; margin-bottom:8px; }
  .daytabs button { background:var(--card); border:2px solid var(--line); border-radius:10px; padding:10px 0; font-weight:700; }
  .daytabs button.on { background:var(--accent); border-color:var(--accent); color:#fff; }
  .prow { display:flex; align-items:center; gap:8px; margin-bottom:6px; }
  .prow span { width:4.2em; flex:0 0 auto; font-size:.9rem; color:var(--sub); }
  .krow { display:flex; gap:6px; margin-bottom:6px; }
  .krow button { flex:0 0 auto; }
  .actions { display:flex; gap:8px; flex-wrap:wrap; margin-top:16px; }
  .primary { background:var(--accent); color:#fff; border-radius:12px; padding:12px 18px; font-weight:700; }
  .plain { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px 16px; }
  .danger { color:var(--danger); }
  .note { font-size:.8rem; color:var(--sub); margin:8px 0 0; }
  .warn { background:#fff5e0; color:#6b4a00; border-radius:10px; padding:8px 10px; font-size:.82rem; margin-bottom:6px; }
  @media (prefers-color-scheme: dark) { .warn { background:#3a2e12; color:#f3dca6; } }
  footer { text-align:center; font-size:.78rem; color:var(--sub); margin-top:16px; }
</style>
</head>
<body>
<main>
  <div id="update"><span>新しい版があります</span><button id="update-btn">更新する</button></div>
  <header>
    <h1>📚 時間割ノート</h1>
    <button class="iconbtn" id="open-settings">⚙️ 設定</button>
  </header>

  <div class="kids" id="kids"></div>
  <div id="today"></div>
  <div id="tomorrow"></div>
  <button class="bigbtn" id="open-edit">✏️ 時間割・持ち物を入れる</button>
  <div class="week" id="week"></div>
  <footer>版 <span id="ver"></span> ・ データはこのiPhoneの中だけに保存されます</footer>
</main>

<!-- 時間割の入力 -->
<div class="sheet" id="edit">
  <div class="inner">
    <h2 id="edit-title">時間割を入れる</h2>
    <div class="daytabs" id="daytabs"></div>
    <div id="periods"></div>
    <label class="f" for="e-memo">この曜日の持ち物メモ</label>
    <textarea id="e-memo" maxlength="300" placeholder="例：体操服、絵の具セット、上ばき"></textarea>
    <label class="f" for="e-always">いつもの持ち物（毎日表示されます）</label>
    <textarea id="e-always" maxlength="300" placeholder="例：ハンカチ、ティッシュ、連絡帳" style="min-height:3.5em"></textarea>
    <datalist id="subj-list"></datalist>
    <p class="note">教科名は自由に入れられます。同じ教科名には、いつも同じ色がつきます。空にした時間は「なし」になります。</p>
    <div class="actions">
      <button class="primary" id="e-save">保存する</button>
      <button class="plain" id="e-cancel">やめる</button>
    </div>
  </div>
</div>

<!-- 設定 -->
<div class="sheet" id="settings">
  <div class="inner">
    <h2>⚙️ 設定</h2>
    <label class="f">子どもの呼び名</label>
    <div class="warn">本名や学校名など、個人を特定できる情報は書かないでください（例：「長女」「おにいちゃん」など）。</div>
    <div id="kid-edit"></div>
    <button class="plain" id="kid-add">＋ 子どもを追加</button>
    <div class="actions"><button class="primary" id="kid-save">呼び名を保存</button></div>

    <label class="f" style="margin-top:22px">バックアップ</label>
    <p class="note" style="margin-top:0">ホーム画面のアイコンを削除すると、時間割もすべて消えます。学期の初めなどに書き出して、「ファイル」アプリなどに保存してください。</p>
    <div class="actions">
      <button class="plain" id="export">書き出す（保存）</button>
      <button class="plain" id="import-btn">読み込む</button>
      <input type="file" id="import" accept="application/json,.json" hidden>
    </div>
    <div class="actions"><button class="plain" id="s-close">閉じる</button></div>
  </div>
</div>

<script>
// ===== 基本の設定 =====
// アプリを更新するときは、この番号と sw.js の VERSION を同じ番号に上げる
const APP_VERSION = '1.0.0';
const KEY_DATA = 'jikanwari:data';   // 子どもの一覧と時間割
const KEY_CUR = 'jikanwari:cur';     // いま選んでいる子ども
const DAYS = ['月', '火', '水', '木', '金'];
const WEEK_JA = ['日', '月', '火', '水', '木', '金', '土'];
const PERIODS = 6;
const MAX_KIDS = 8;
const COMMON_SUBJ = ['国語', '算数', '理科', '社会', '生活', '音楽', '図工', '体育', '家庭', '英語', '外国語', '道徳', '学活', '総合', '書写', '数学', '技術', '美術', '保健体育'];
const $ = (id) => document.getElementById(id);

// ===== 小さな道具 =====
function load(key, fallback) { try { const t = localStorage.getItem(key); return t ? JSON.parse(t) : fallback; } catch (e) { return fallback; } }
function save(key, v) { try { localStorage.setItem(key, JSON.stringify(v)); return true; } catch (e) { alert('保存できませんでした。'); return false; } }
function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; }
const str = (v, max) => (typeof v === 'string' ? v : '').slice(0, max);
function newId() { return 'k' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

// 教科名から色（色相）を決める。同じ名前ならいつも同じ色
function hueOf(name) {
  let h = 0;
  for (const ch of name) h = (h * 31 + ch.codePointAt(0)) >>> 0;
  return (h % 12) * 30 + 10;
}

// 1人分の時間割を、欠けや壊れがない形に整える
function cleanKid(k, i) {
  k = k && typeof k === 'object' ? k : {};
  const days = DAYS.map((_, d) => {
    const row = Array.isArray(k.days) && Array.isArray(k.days[d]) ? k.days[d] : [];
    return Array.from({ length: PERIODS }, (_, p) => str(row[p], 20).trim());
  });
  const memos = DAYS.map((_, d) => str(Array.isArray(k.memos) ? k.memos[d] : '', 300));
  return { id: str(k.id, 40) || newId(), name: str(k.name, 12).trim() || ('子ども' + (i + 1)), days, memos, always: str(k.always, 300) };
}
function defaultData() { return { kids: [1, 2, 3, 4].map((n, i) => cleanKid({ name: '子ども' + n }, i)) }; }
function cleanData(d) {
  if (!d || !Array.isArray(d.kids) || !d.kids.length) return defaultData();
  const kids = d.kids.slice(0, MAX_KIDS).map(cleanKid);
  const seen = new Set();
  kids.forEach((k) => { if (seen.has(k.id)) k.id = newId(); seen.add(k.id); });
  return { kids };
}

let data = cleanData(load(KEY_DATA, null));
let curId = load(KEY_CUR, '');
function curKid() { return data.kids.find((k) => k.id === curId) || data.kids[0]; }

// ===== 画面の表示 =====
function subjEl(name) {
  if (!name) return el('span', 'subj none', 'なし');
  const s = el('span', 'subj', name); s.style.setProperty('--h', hueOf(name)); return s;
}
function dayCard(kid, date, label, isToday) {
  const box = el('div', 'day' + (isToday ? ' today' : ''));
  const h = el('h2', '', label);
  h.append(el('small', '', (date.getMonth() + 1) + '月' + date.getDate() + '日（' + WEEK_JA[date.getDay()] + '）'));
  box.append(h);
  const wd = date.getDay();
  if (wd === 0 || wd === 6) { box.append(el('div', 'rest', '🌈 お休み')); return box; }
  const d = wd - 1;
  const row = kid.days[d];
  let last = PERIODS; while (last > 0 && !row[last - 1]) last--;
  if (!last) {
    box.append(el('p', 'empty', 'まだ時間割が入っていません。下の「時間割・持ち物を入れる」から入れてください。'));
  } else {
    for (let p = 0; p < last; p++) {
      const r = el('div', 'per'); r.append(el('span', 'n', (p + 1) + '時間目'), subjEl(row[p])); box.append(r);
    }
  }
  const memo = [kid.memos[d], kid.always].map((t) => t.trim()).filter(Boolean).join('\n');
  if (memo) { const m = el('div', 'memo'); m.append(el('b', '', '🎒 持ち物'), document.createTextNode(memo)); box.append(m); }
  return box;
}
function render() {
  const kid = curKid(); curId = kid.id;
  // 子どもの切り替え
  const kb = $('kids'); kb.innerHTML = '';
  data.kids.forEach((k) => {
    const b = el('button', k.id === kid.id ? 'on' : '', k.name);
    b.onclick = () => { curId = k.id; save(KEY_CUR, curId); render(); };
    kb.append(b);
  });
  const now = new Date();
  const tmr = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1);
  $('today').replaceChildren(dayCard(kid, now, '今日', true));
  $('tomorrow').replaceChildren(dayCard(kid, tmr, '明日', false));
  // 1週間の表
  const w = $('week'); w.innerHTML = '';
  w.append(el('h3', '', '🗓 ' + kid.name + 'の1週間'));
  const t = el('table'); const head = el('tr'); head.append(el('th', ''));
  DAYS.forEach((d, i) => head.append(el('th', now.getDay() === i + 1 ? 'now' : '', d)));
  t.append(head);
  for (let p = 0; p < PERIODS; p++) {
    const tr = el('tr'); tr.append(el('td', 'num', String(p + 1)));
    DAYS.forEach((_, d) => {
      const name = kid.days[d][p];
      const td = el('td', name ? '' : 'blank', name || '・');
      if (name) td.style.setProperty('--h', hueOf(name));
      tr.append(td);
    });
    t.append(tr);
  }
  w.append(t);
  $('open-edit').textContent = '✏️ ' + kid.name + 'の時間割・持ち物を入れる';
}

// ===== 時間割の入力 =====
let draft = null, draftDay = 0;
function openEdit() {
  const kid = curKid();
  draft = JSON.parse(JSON.stringify(kid));
  const wd = new Date().getDay();
  draftDay = wd >= 1 && wd <= 5 ? wd - 1 : 0;
  $('edit-title').textContent = kid.name + 'の時間割';
  $('e-always').value = draft.always;
  // 教科名の候補（入力済みの教科＋よく使う教科）
  const used = new Set(); data.kids.forEach((k) => k.days.flat().forEach((s) => s && used.add(s)));
  const dl = $('subj-list'); dl.innerHTML = '';
  [...new Set([...used, ...COMMON_SUBJ])].forEach((s) => dl.append(new Option(s)));
  showDay();
  $('edit').classList.add('open'); window.scrollTo(0, 0);
}
function keepDay() {
  if (!draft) return;
  draft.days[draftDay] = [...$('periods').querySelectorAll('input')].map((i) => i.value.trim().slice(0, 20));
  draft.memos[draftDay] = $('e-memo').value.slice(0, 300);
}
function showDay() {
  const tabs = $('daytabs'); tabs.innerHTML = '';
  DAYS.forEach((d, i) => {
    const b = el('button', i === draftDay ? 'on' : '', d);
    b.onclick = () => { keepDay(); draftDay = i; showDay(); };
    tabs.append(b);
  });
  const box = $('periods'); box.innerHTML = '';
  for (let p = 0; p < PERIODS; p++) {
    const r = el('div', 'prow'); r.append(el('span', '', (p + 1) + '時間目'));
    const inp = el('input'); inp.maxLength = 20; inp.value = draft.days[draftDay][p]; inp.setAttribute('list', 'subj-list');
    inp.placeholder = 'なし'; inp.setAttribute('aria-label', DAYS[draftDay] + '曜' + (p + 1) + '時間目');
    r.append(inp); box.append(r);
  }
  $('e-memo').value = draft.memos[draftDay];
}
$('open-edit').onclick = openEdit;
$('e-cancel').onclick = () => { draft = null; $('edit').classList.remove('open'); };
$('e-save').onclick = () => {
  if (!draft) return;
  keepDay();
  draft.always = $('e-always').value.slice(0, 300);
  const i = data.kids.findIndex((k) => k.id === draft.id);
  if (i < 0) return;
  data.kids[i] = cleanKid(draft, i);
  if (!save(KEY_DATA, data)) return;
  draft = null;
  $('edit').classList.remove('open');
  render();
};

// ===== 設定：子どもの呼び名 =====
function buildKidEdit() {
  const box = $('kid-edit'); box.innerHTML = '';
  data.kids.forEach((k) => addKidRow(k.id, k.name));
}
function addKidRow(id, name) {
  const row = el('div', 'krow'); row.dataset.id = id;
  const inp = el('input'); inp.value = name; inp.maxLength = 12; inp.placeholder = '呼び名';
  const del = el('button', 'plain danger', '削除');
  del.onclick = () => {
    if ($('kid-edit').children.length <= 1) { alert('1人は残してください。'); return; }
    if (!confirm('「' + (inp.value || '名前なし') + '」の時間割を削除します。「呼び名を保存」で確定します。')) return;
    row.remove();
  };
  row.append(inp, del); $('kid-edit').append(row);
  return inp;
}
$('kid-add').onclick = () => {
  if ($('kid-edit').children.length >= MAX_KIDS) { alert(MAX_KIDS + '人までです。'); return; }
  addKidRow(newId(), '').focus();
};
$('kid-save').onclick = () => {
  const rows = [...$('kid-edit').children];
  if (rows.some((r) => !r.querySelector('input').value.trim())) { alert('呼び名が空の欄があります。入れてください。'); return; }
  data.kids = rows.map((r, i) => {
    const old = data.kids.find((k) => k.id === r.dataset.id) || { id: r.dataset.id };
    return cleanKid({ ...old, name: r.querySelector('input').value.trim() }, i);
  });
  if (!save(KEY_DATA, data)) return;
  buildKidEdit(); render();
  alert('呼び名を保存しました。');
};
$('open-settings').onclick = () => { buildKidEdit(); $('settings').classList.add('open'); window.scrollTo(0, 0); };
$('s-close').onclick = () => { $('settings').classList.remove('open'); render(); };

// ===== 設定：バックアップ =====
const p2 = (n) => String(n).padStart(2, '0');
$('export').onclick = async () => {
  const d = new Date();
  const name = 'jikanwari-backup-' + d.getFullYear() + p2(d.getMonth() + 1) + p2(d.getDate()) + '.json';
  const text = JSON.stringify({ app: 'jikanwari', version: APP_VERSION, exportedAt: d.toISOString(), kids: data.kids }, null, 1);
  const file = new File([text], name, { type: 'application/json' });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], title: name }); } catch (e) {}
    return;
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(file); a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 10000);
};
$('import-btn').onclick = () => $('import').click();
$('import').onchange = async (e) => {
  const f = e.target.files[0]; e.target.value = '';
  if (!f) return;
  let d;
  try { d = JSON.parse(await f.text()); } catch (err) { alert('ファイルを読み取れませんでした。壊れているか、別の種類のファイルです。'); return; }
  if (!d || d.app !== 'jikanwari' || !Array.isArray(d.kids) || !d.kids.length) { alert('このアプリ（時間割ノート）のバックアップファイルではありません。'); return; }
  if (!confirm(d.kids.length + '人分の時間割を読み込みます。いまの時間割は、ファイルの内容に置きかわります。よろしいですか？')) return;
  data = cleanData({ kids: d.kids });
  save(KEY_DATA, data);
  buildKidEdit(); render();
  alert('読み込みました。');
};

// ===== 日付が変わったら表示を新しくする =====
let shownDate = new Date().toDateString();
function checkDate() { const t = new Date().toDateString(); if (t !== shownDate) { shownDate = t; render(); } }
setInterval(checkDate, 60000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) checkDate(); });

// ===== オフライン動作と更新の受け取り（サービスワーカー） =====
if ('serviceWorker' in navigator) {
  const hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.register('sw.js').then((reg) => {
    const showUpdate = (w) => { $('update').style.display = 'flex'; $('update-btn').onclick = () => w.postMessage('SKIP_WAITING'); };
    if (reg.waiting && navigator.serviceWorker.controller) showUpdate(reg.waiting);
    reg.addEventListener('updatefound', () => {
      const w = reg.installing;
      w.addEventListener('statechange', () => { if (w.state === 'installed' && navigator.serviceWorker.controller) showUpdate(w); });
    });
    document.addEventListener('visibilitychange', () => { if (!document.hidden) reg.update(); });
  });
  let reloaded = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (!hadController || reloaded || $('edit').classList.contains('open') || $('settings').classList.contains('open')) return; // 入力中は読み込み直さない
    reloaded = true; location.reload();
  });
}

// ===== 起動 =====
$('ver').textContent = APP_VERSION;
render();
</script>
</body>
</html>
