<!doctype html>
<!-- このファイルは「予防接種スケジュール帳」の本体です。子どもごとに、接種の名前・予定日・済みの日・メモを自分で入力して記録し、予定が近い順に一覧できます。 -->
<!-- ワクチンの種類や時期はアプリには書き込んでいません（あなたが入力したものだけを表示）。記録はiPhoneの中のデータベース（IndexedDB）だけに保存し、外部へは一切送信しません。 -->
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>予防接種スケジュール帳</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-title" content="接種メモ">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#2a8c82">
<style>
  :root { --bg:#f3f8f7; --card:#fff; --text:#1b2633; --sub:#5a6675; --accent:#2a8c82; --accent-soft:#dff0ed; --line:#dbe5e3; --danger:#c8372d;
          --ok:#2f8f4e; --ok-soft:#e3f4e8; --soon:#d07a12; --late:#c8372d; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#111917; --card:#1b2422; --text:#e9f1ef; --sub:#9db0ac; --accent:#2f9d91; --accent-soft:#1d3632; --line:#2b3a37; --danger:#ef6b61;
            --ok:#5fcf86; --ok-soft:#183324; --soon:#f0a54a; --late:#ef6b61; }
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif; line-height:1.5; }
  main { max-width:640px; margin:0 auto; padding:calc(12px + env(safe-area-inset-top)) 16px calc(100px + env(safe-area-inset-bottom)); }
  header { display:flex; align-items:center; justify-content:space-between; gap:8px; margin:4px 0 10px; }
  h1 { font-size:1.3rem; margin:0; }
  button { font:inherit; color:inherit; background:none; border:none; cursor:pointer; touch-action:manipulation; }
  input, select, textarea { font:inherit; color:var(--text); background:var(--card); border:1px solid var(--line); border-radius:10px; padding:10px; width:100%; }
  input[type=date] { min-height:46px; -webkit-appearance:none; appearance:none; }
  textarea { min-height:5em; resize:vertical; }
  .iconbtn { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:8px 12px; white-space:nowrap; }
  #update { display:none; background:var(--accent); color:#fff; border-radius:12px; padding:10px 14px; margin-bottom:10px; align-items:center; justify-content:space-between; }
  #update button { background:#fff; color:var(--accent); border-radius:99px; padding:6px 14px; font-weight:700; }

  .info { background:var(--accent-soft); color:var(--text); border-radius:12px; padding:10px 12px; font-size:.88rem; margin-bottom:10px; }
  .info b { color:var(--accent); }

  /* 絞り込み */
  .filters { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:6px; }
  .seg { display:flex; background:var(--card); border:1px solid var(--line); border-radius:10px; overflow:hidden; }
  .seg button { flex:1; padding:9px 4px; font-size:.9rem; }
  .seg button.on { background:var(--accent); color:#fff; font-weight:700; }
  .counts { font-size:.82rem; color:var(--sub); margin:6px 0 10px; }

  /* カード */
  .card { background:var(--card); border:1px solid var(--line); border-left:6px solid var(--kc, var(--line)); border-radius:12px; padding:12px 12px 12px 14px; margin-bottom:10px; display:flex; gap:10px; align-items:center; }
  .card .body { flex:1; min-width:0; cursor:pointer; }
  .card .t { font-weight:700; word-break:break-word; }
  .card .m { font-size:.82rem; color:var(--sub); margin-top:3px; }
  .card .memo { font-size:.82rem; color:var(--sub); margin-top:3px; white-space:pre-wrap; word-break:break-word; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .card.done { opacity:.7; }
  .kid { display:inline-block; font-size:.75rem; border-radius:99px; padding:0 8px; margin-right:6px; color:#fff; background:var(--kc); font-weight:700; }
  .when { font-weight:700; }
  .nw { white-space:nowrap; }
  .when.soon { color:var(--soon); }
  .when.late { color:var(--late); }
  .tog { flex:none; width:74px; min-height:56px; border-radius:12px; border:2px solid var(--line); background:var(--bg); font-size:.82rem; line-height:1.2; padding:6px 4px; }
  .tog.on { border-color:var(--ok); background:var(--ok-soft); color:var(--ok); font-weight:700; }
  .sec { font-size:.85rem; color:var(--sub); font-weight:700; margin:16px 0 8px; }
  .empty { color:var(--sub); text-align:center; padding:30px 0; }

  #add { position:fixed; right:20px; bottom:calc(20px + env(safe-area-inset-bottom)); width:62px; height:62px; border-radius:50%;
         background:var(--accent); color:#fff; font-size:2rem; box-shadow:0 4px 12px rgba(0,0,0,.25); }

  /* 編集・設定の画面（全面） */
  .sheet { position:fixed; inset:0; background:var(--bg); overflow:auto; display:none; z-index:10; }
  .sheet.open { display:block; }
  .sheet .inner { max-width:640px; margin:0 auto; padding:calc(12px + env(safe-area-inset-top)) 16px calc(30px + env(safe-area-inset-bottom)); }
  .sheet h2 { font-size:1.15rem; margin:4px 0 12px; }
  label.f { display:block; font-size:.85rem; color:var(--sub); margin:12px 0 4px; }
  .row2 { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .row2 > div { min-width:0; }
  .actions { display:flex; gap:8px; flex-wrap:wrap; margin-top:16px; }
  .primary { background:var(--accent); color:#fff; border-radius:12px; padding:12px 18px; font-weight:700; }
  .plain { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px 16px; }
  .small { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:6px 10px; font-size:.85rem; margin-top:6px; }
  .danger { color:var(--danger); }
  .note { font-size:.8rem; color:var(--sub); margin:8px 0 0; }
  .warn { background:#fff5e0; color:#6b4a00; border-radius:10px; padding:8px 10px; font-size:.82rem; margin-bottom:6px; }
  @media (prefers-color-scheme: dark) { .warn { background:#3a2e12; color:#f3dca6; } }
  .kidrow { display:flex; gap:8px; align-items:center; margin-bottom:6px; }
  .kidrow .dot { flex:none; width:18px; height:18px; border-radius:50%; background:var(--kc); }
  footer { text-align:center; font-size:.78rem; color:var(--sub); margin-top:16px; }
</style>
</head>
<body>
<main>
  <div id="update"><span>新しい版があります</span><button id="update-btn">更新する</button></div>
  <header>
    <h1>💉 予防接種スケジュール帳</h1>
    <button class="iconbtn" id="open-settings">⚙️ 設定</button>
  </header>

  <div class="info"><b>予定はかかりつけ医や区の案内でご確認ください。</b><br>このアプリは、あなたが入力した予定と記録を並べて見るための道具です。接種の種類や時期をアプリから案内することはありません。</div>

  <div class="filters">
    <select id="f-kid" aria-label="子どもで絞り込み"></select>
    <div class="seg" id="f-st">
      <button data-v="todo">未</button><button data-v="done">済み</button><button data-v="all">全部</button>
    </div>
  </div>
  <div class="counts" id="counts"></div>
  <div id="list"></div>
  <footer>版 <span id="ver"></span> ・ データはこのiPhoneの中だけに保存されます</footer>
</main>

<button id="add" aria-label="予定を追加">＋</button>

<!-- 入力・編集 -->
<div class="sheet" id="edit">
  <div class="inner">
    <h2 id="edit-title">予定を追加</h2>
    <div class="warn">子どもの本名・生年月日・住所など、個人を特定できる情報は書かないでください。</div>
    <label class="f" for="e-kid">子ども</label>
    <select id="e-kid"></select>
    <label class="f" for="e-name">接種の名前</label>
    <input id="e-name" maxlength="60" placeholder="案内や母子手帳に書かれた名前をそのまま">
    <div class="row2">
      <div><label class="f" for="e-plan">予定日</label><input id="e-plan" type="date"></div>
      <div><label class="f" for="e-done">済みの日</label><input id="e-done" type="date"></div>
    </div>
    <button class="small" id="e-done-today" type="button">済みの日を今日にする</button>
    <button class="small" id="e-done-clear" type="button">済みの日を消す（未に戻す）</button>
    <label class="f" for="e-memo">メモ（病院の予約、持ち物など）</label>
    <textarea id="e-memo" maxlength="500"></textarea>
    <div class="actions">
      <button class="primary" id="e-save">保存する</button>
      <button class="plain" id="e-cancel">やめる</button>
      <button class="plain danger" id="e-del" hidden>削除</button>
    </div>
    <p class="note">予定日・済みの日は空のままでも保存できます。</p>
  </div>
</div>

<!-- 設定 -->
<div class="sheet" id="settings">
  <div class="inner">
    <h2>⚙️ 設定</h2>
    <label class="f">子どもの呼び名（本名ではなく「長男」「〇〇ちゃん」など家の中の呼び名で）</label>
    <div id="kid-edit"></div>
    <button class="plain" id="kid-add">＋ 子どもを追加</button>
    <div class="actions"><button class="primary" id="kid-save">呼び名を保存</button></div>

    <label class="f" style="margin-top:22px">バックアップ</label>
    <p class="note" style="margin-top:0">ホーム画面のアイコンを削除すると、記録もすべて消えます。ときどき書き出して、「ファイル」アプリなどに保存してください。</p>
    <div class="actions">
      <button class="plain" id="export">書き出す（共有・保存）</button>
      <button class="plain" id="import-btn">読み込む</button>
      <input type="file" id="import" accept="application/json,.json" hidden>
    </div>
    <div class="actions"><button class="plain" id="s-close">閉じる</button></div>
  </div>
</div>

<script>
// ===== 基本の設定 =====
// アプリを更新するときは、この番号と sw.js の VERSION を同じ番号に上げる
const APP_VERSION = '1.0.0';
const KEY_KIDS = 'yobou:kids';        // 子どもの呼び名
const KEY_FILTER = 'yobou:filter';    // 最後に選んだ絞り込み
const KID_COLORS = ['#e0533d', '#2f7fd0', '#2f9e6b', '#c9861a', '#8a5cd0', '#c2417f', '#4a8a9a', '#7a7a2a'];
const DEFAULT_KIDS = [1, 2, 3, 4].map((n) => ({ id: 'k' + n, name: '子ども' + n }));
const $ = (id) => document.getElementById(id);

// ===== 端末内のデータベース（IndexedDB） =====
function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open('yobou', 1);
    req.onupgradeneeded = () => req.result.createObjectStore('items', { keyPath: 'id' });
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function dbDo(mode, fn) {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction('items', mode);
    const r = fn(tx.objectStore('items'));
    tx.oncomplete = () => resolve(r && r.result);
    tx.onerror = () => reject(tx.error);
  });
}
const dbAll = () => dbDo('readonly', (s) => s.getAll());
const dbPut = (it) => dbDo('readwrite', (s) => s.put(it));
const dbDel = (id) => dbDo('readwrite', (s) => s.delete(id));

// ===== 小さな道具 =====
function load(key, fallback) { try { const t = localStorage.getItem(key); return t ? JSON.parse(t) : fallback; } catch (e) { return fallback; } }
function save(key, v) { try { localStorage.setItem(key, JSON.stringify(v)); } catch (e) {} }
const p2 = (n) => String(n).padStart(2, '0');
const WEEK = ['日', '月', '火', '水', '木', '金', '土'];
function dateKey(d) { return d.getFullYear() + '-' + p2(d.getMonth() + 1) + '-' + p2(d.getDate()); }
function todayKey() { return dateKey(new Date()); }
function parseKey(k) { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); }
function fmtDay(k) { const d = parseKey(k); return d.getFullYear() + '/' + (d.getMonth() + 1) + '/' + d.getDate() + '（' + WEEK[d.getDay()] + '）'; }
function daysFromToday(k) { return Math.round((parseKey(k) - parseKey(todayKey())) / 86400000); }
function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; }

let kids = load(KEY_KIDS, DEFAULT_KIDS);
let items = [];
let filter = load(KEY_FILTER, { kid: '', st: 'todo' });
const kidName = (id) => { const k = kids.find((x) => x.id === id); return k ? k.name : '（不明）'; };
const kidColor = (id) => { const i = kids.findIndex((x) => x.id === id); return KID_COLORS[(i < 0 ? 7 : i) % KID_COLORS.length]; };

// ===== 一覧の表示 =====
function buildFilters() {
  const sel = $('f-kid'); sel.innerHTML = '';
  sel.add(new Option('全員', ''));
  kids.forEach((k) => sel.add(new Option(k.name, k.id)));
  sel.value = kids.some((k) => k.id === filter.kid) ? filter.kid : '';
}
function whenText(it) {
  if (it.done) return { text: '済み ' + fmtDay(it.done), cls: '' };
  if (!it.plan) return { text: '予定日 未定', cls: '' };
  const n = daysFromToday(it.plan);
  const rest = n === 0 ? '今日' : n > 0 ? 'あと' + n + '日' : (-n) + '日過ぎています';
  return { text: '予定 ' + fmtDay(it.plan), rest, cls: n < 0 ? 'late' : n <= 14 ? 'soon' : '' };
}
function card(it) {
  const c = el('div', 'card' + (it.done ? ' done' : ''));
  c.style.setProperty('--kc', kidColor(it.kid));
  const body = el('div', 'body');
  body.append(el('div', 't', it.name || '（名前なし）'));
  const m = el('div', 'm');
  const k = el('span', 'kid', kidName(it.kid)); m.append(k);
  const w = whenText(it);
  const wt = el('span', 'when ' + w.cls); wt.append(el('span', 'nw', w.text));
  if (w.rest) wt.append(document.createTextNode(' '), el('span', 'nw', '・' + w.rest));
  m.append(wt);
  body.append(m);
  if (it.done && it.plan) body.append(el('div', 'm', '（予定は ' + fmtDay(it.plan) + '）'));
  if (it.memo) body.append(el('div', 'memo', it.memo));
  body.onclick = () => openEdit(it);
  const tog = el('button', 'tog' + (it.done ? ' on' : ''), it.done ? '✓ 済み' : '未');
  tog.setAttribute('aria-label', it.done ? '未に戻す' : '済みにする');
  tog.onclick = () => toggleDone(it);
  c.append(body, tog);
  return c;
}
function render() {
  filter.kid = $('f-kid').value;
  save(KEY_FILTER, filter);
  document.querySelectorAll('#f-st button').forEach((b) => b.classList.toggle('on', b.dataset.v === filter.st));
  const mine = items.filter((i) => !filter.kid || i.kid === filter.kid);
  const todo = mine.filter((i) => !i.done)
    // 予定が近い順（予定日のないものは最後）
    .sort((a, b) => (a.plan || '9999') < (b.plan || '9999') ? -1 : (a.plan || '9999') > (b.plan || '9999') ? 1 : a.createdAt - b.createdAt);
  const done = mine.filter((i) => i.done).sort((a, b) => a.done < b.done ? 1 : a.done > b.done ? -1 : 0); // 新しく済んだ順
  $('counts').textContent = (filter.kid ? kidName(filter.kid) + '：' : '全員：') + '未 ' + todo.length + '件 ／ 済み ' + done.length + '件';

  const list = $('list'); list.innerHTML = '';
  if (!items.length) { list.append(el('p', 'empty', 'まだ予定はありません。右下の「＋」から追加してください。')); return; }
  const showTodo = filter.st !== 'done', showDone = filter.st !== 'todo';
  if (showTodo) {
    if (filter.st === 'all') list.append(el('div', 'sec', 'まだのもの（予定が近い順）'));
    if (!todo.length) list.append(el('p', 'empty', 'まだのものはありません'));
    todo.forEach((it) => list.append(card(it)));
  }
  if (showDone) {
    if (filter.st === 'all') list.append(el('div', 'sec', '済んだもの（新しい順）'));
    if (!done.length) list.append(el('p', 'empty', '済んだものはありません'));
    done.forEach((it) => list.append(card(it)));
  }
}
$('f-kid').addEventListener('change', render);
document.querySelectorAll('#f-st button').forEach((b) => b.onclick = () => { filter.st = b.dataset.v; render(); });

async function reload() {
  try { items = await dbAll(); } catch (e) { items = []; alert('データベースを開けませんでした。'); }
  buildFilters();
  render();
}
async function toggleDone(it) {
  const next = { ...it, done: it.done ? '' : todayKey(), updatedAt: Date.now() };
  if (it.done && !confirm('「' + (it.name || '名前なし') + '」を「未」に戻します。よろしいですか？')) return;
  try { await dbPut(next); } catch (e) { alert('保存できませんでした。'); return; }
  reload();
}

// ===== 入力・編集 =====
let editing = null;
function openEdit(it) {
  editing = it || null;
  const sel = $('e-kid'); sel.innerHTML = '';
  kids.forEach((k) => sel.add(new Option(k.name, k.id)));
  if (it && !kids.some((k) => k.id === it.kid)) sel.add(new Option('（不明）', it.kid));
  $('edit-title').textContent = it ? '予定を編集' : '予定を追加';
  sel.value = it ? it.kid : (filter.kid || kids[0].id);
  $('e-name').value = it ? it.name : '';
  $('e-plan').value = it ? it.plan : '';
  $('e-done').value = it ? it.done : '';
  $('e-memo').value = it ? it.memo : '';
  $('e-del').hidden = !it;
  $('edit').classList.add('open');
  window.scrollTo(0, 0);
}
function closeSheet(id) { $(id).classList.remove('open'); }
$('add').onclick = () => openEdit(null);
$('e-cancel').onclick = () => closeSheet('edit');
$('e-done-today').onclick = () => { $('e-done').value = todayKey(); };
$('e-done-clear').onclick = () => { $('e-done').value = ''; };
$('e-save').onclick = async () => {
  const now = Date.now();
  const it = editing ? { ...editing } : { id: 'v' + now + Math.random().toString(36).slice(2, 6), createdAt: now };
  it.kid = $('e-kid').value;
  it.name = $('e-name').value.trim().slice(0, 60);
  it.plan = $('e-plan').value;
  it.done = $('e-done').value;
  it.memo = $('e-memo').value.slice(0, 500);
  it.updatedAt = now;
  if (!it.name) { alert('接種の名前を入れてください。'); return; }
  try { await dbPut(it); } catch (e) { alert('保存できませんでした。iPhoneの空き容量を確認してください。'); return; }
  closeSheet('edit');
  reload();
};
$('e-del').onclick = async () => {
  if (!editing || !confirm('「' + (editing.name || '名前なし') + '」を削除します。元に戻せません。よろしいですか？')) return;
  await dbDel(editing.id);
  closeSheet('edit');
  reload();
};

// ===== 設定：子どもの呼び名 =====
function buildKidEdit() {
  const box = $('kid-edit'); box.innerHTML = '';
  kids.forEach((k, i) => addKidRow(k, i));
}
function addKidRow(k, i) {
  const row = el('div', 'kidrow');
  row.style.setProperty('--kc', KID_COLORS[i % KID_COLORS.length]);
  const inp = el('input'); inp.value = k.name; inp.maxLength = 12; inp.dataset.id = k.id;
  row.append(el('span', 'dot'), inp);
  $('kid-edit').append(row);
  return inp;
}
$('kid-add').onclick = () => {
  const n = $('kid-edit').querySelectorAll('input').length;
  if (n >= 8) { alert('8人までです。'); return; }
  addKidRow({ id: 'k' + Date.now().toString(36), name: '' }, n).focus();
};
$('kid-save').onclick = () => {
  const rows = [...$('kid-edit').querySelectorAll('input')];
  // 記録がある子どもは、呼び名を空にしても消さずに元の名前を残す
  kids = rows.map((inp, i) => ({ id: inp.dataset.id, name: inp.value.trim() || (kids.find((k) => k.id === inp.dataset.id) || {}).name || '子ども' + (i + 1) }));
  save(KEY_KIDS, kids);
  buildKidEdit(); buildFilters(); render();
  alert('呼び名を保存しました。');
};
$('open-settings').onclick = () => { buildKidEdit(); $('settings').classList.add('open'); window.scrollTo(0, 0); };
$('s-close').onclick = () => closeSheet('settings');

// ===== 設定：バックアップ =====
$('export').onclick = async () => {
  const d = new Date();
  const name = 'yobou-backup-' + d.getFullYear() + p2(d.getMonth() + 1) + p2(d.getDate()) + '.json';
  const data = JSON.stringify({ app: 'yobou', version: APP_VERSION, exportedAt: d.toISOString(), kids, items }, null, 1);
  const file = new File([data], name, { type: 'application/json' });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], title: name }); } catch (e) {}
    return;
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(file); a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 10000);
};
$('import-btn').onclick = () => $('import').click();
$('import').onchange = async (e) => {
  const f = e.target.files[0]; e.target.value = '';
  if (!f) return;
  let data;
  try { data = JSON.parse(await f.text()); } catch (err) { alert('ファイルを読み取れませんでした。'); return; }
  if (!data || data.app !== 'yobou' || !Array.isArray(data.items)) { alert('このアプリのバックアップファイルではありません。'); return; }
  if (!confirm(data.items.length + '件の記録を読み込みます。同じ記録は、ファイルの内容で上書きします（ほかの記録は消えません）。よろしいですか？')) return;
  for (const it of data.items) { if (it && it.id) await dbPut(it); }
  if (Array.isArray(data.kids)) {
    data.kids.forEach((k) => { if (k && k.id && !kids.some((x) => x.id === k.id)) kids.push({ id: k.id, name: String(k.name || '子ども') }); });
    save(KEY_KIDS, kids); buildKidEdit();
  }
  await reload();
  alert('読み込みました。');
};
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});

// ===== オフライン動作と更新の受け取り（サービスワーカー） =====
if ('serviceWorker' in navigator) {
  const hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.register('sw.js').then((reg) => {
    const showUpdate = (w) => { $('update').style.display = 'flex'; $('update-btn').onclick = () => w.postMessage('SKIP_WAITING'); };
    if (reg.waiting && navigator.serviceWorker.controller) showUpdate(reg.waiting);
    reg.addEventListener('updatefound', () => {
      const w = reg.installing;
      w.addEventListener('statechange', () => { if (w.state === 'installed' && navigator.serviceWorker.controller) showUpdate(w); });
    });
    document.addEventListener('visibilitychange', () => { if (!document.hidden) reg.update(); });
  });
  let reloaded = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (!hadController || reloaded || $('edit').classList.contains('open')) return; // 入力中は読み込み直さない
    reloaded = true; location.reload();
  });
}
// 日付が変わったら「あと○日」を出し直す
document.addEventListener('visibilitychange', () => { if (!document.hidden) render(); });

// ===== 起動 =====
$('ver').textContent = APP_VERSION;
reload();
</script>
